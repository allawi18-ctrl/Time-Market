<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>سوق العمر - Prototype 01</title>
<style>
body{margin:0;background:#090a0d;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:820px;margin:auto;padding:16px 14px 70px}
.card{background:#12151b;border:1px solid #2a2f38;border-radius:18px;padding:15px;margin:12px 0}
h1{color:#e2b45a;margin:0 0 4px;font-size:30px}
.sub{color:#9299a4;font-size:13px}
.life{font-size:28px;font-weight:800;color:#f1d493;margin-top:8px}
.hero{height:200px;border-radius:20px;background:linear-gradient(0deg,#070707cc,#0000),radial-gradient(circle at 30% 30%,#7c5524,#17110b 18%,#0c1018 65%);position:relative;overflow:hidden;border:1px solid #42351f}
.hero:after{content:"";position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:58px;height:120px;border-radius:25px 25px 10px 10px;background:#1f2228;box-shadow:0 -30px 0 -8px #6f5945}
.heroText{position:absolute;right:18px;top:18px;max-width:60%;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#171a20;border:1px solid #30343d;border-radius:14px;padding:12px}
.item h3{margin:0}.price{color:#e2b45a;font-weight:800;margin:6px 0}.item p{color:#a7adb7;font-size:13px;min-height:42px}
button{width:100%;padding:12px;border:0;border-radius:11px;background:#c99743;color:#17120a;font-weight:800;font-size:15px}
button.alt{background:#242a33;color:#eee;border:1px solid #3b424d}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.log{color:#adb3bd;font-size:13px;line-height:1.8}
@media(max-width:620px){.grid{grid-template-columns:1fr}.life{font-size:24px}.hero{height:180px}}
</style>
<div class="wrap">
  <div class="card">
    <h1>سوق العمر</h1>
    <div class="sub">THE TIME MARKET — Prototype 01</div>
    <div class="sub" style="margin-top:12px">العمر المتبقي</div>
    <div class="life" id="life"></div>
    <div class="sub" id="spent"></div>
  </div>

  <div class="hero">
    <div class="heroText">
      <b style="font-size:22px">ليلة السوق الأولى</b>
      <div style="color:#d7cbb6;line-height:1.7;margin-top:7px">هنا لا أحد يسأل كم معك من المال. السؤال الوحيد: كم بقي لك من العمر؟</div>
    </div>
  </div>

  <div class="card">
    <h2>أسعار الليلة</h2>
    <div class="grid" id="shop"></div>
  </div>

  <div class="card">
    <h2>أول قرار</h2>
    <p id="story">تقترب امرأة تحمل طفلًا مريضًا. العلاج متوفر، لكنه يكلف <b>3 سنوات</b>. لا تملك هي سوى 11 يومًا.</p>
    <div class="choices" id="choices">
      <button onclick="chooseStory(true)">أعطها 3 سنوات</button>
      <button class="alt" onclick="chooseStory(false)">ارفض</button>
    </div>
  </div>

  <div class="card">
    <h2>سجل عمرك</h2>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
const YEAR=365;
const start=61*YEAR+8*30+12;
let s=JSON.parse(localStorage.getItem("timeMarket01")||"null")||{r:start,spent:0,bought:{},story:null,log:["دخلت سوق العمر لأول مرة."]};
const items=[
["meal","عشاء فاخر",2,"يومان","وجبة لا تُشترى بالمال."],
["secret","معلومة سرية",17,"17 يومًا","اسم شخص يشتري أعمار الناس سرًا."],
["car","سيارة سوداء",120,"4 أشهر","تسمح لك بدخول الأحياء العليا."],
["home","شقة صغيرة",730,"سنتان","منزل دائم داخل المدينة."],
["memory","استعادة ذكرى",365,"سنة","ذكرى محذوفة من ماضيك."],
["future","رؤية المستقبل",3650,"10 سنوات","خمس دقائق فقط من مستقبلك المحتمل."]
];
function fmt(d){let y=Math.floor(d/365);d-=y*365;let m=Math.floor(d/30);d-=m*30;return `${y} سنة و ${m} شهر و ${Math.floor(d)} يوم`}
function save(){localStorage.setItem("timeMarket01",JSON.stringify(s))}
function buy(id){
  const it=items.find(x=>x[0]===id); if(s.bought[id])return;
  if(s.r<=it[2]){alert("لا يوجد عمر كافٍ");return}
  s.r-=it[2];s.spent+=it[2];s.bought[id]=1;s.log.push(`اشتريت ${it[1]} مقابل ${it[3]}.`);save();render()
}
function chooseStory(give){
  if(s.story!==null)return;
  s.story=give;
  if(give){s.r-=1095;s.spent+=1095;s.log.push("منحت الطفل 3 سنوات من عمرك.");}
  else{s.log.push("رفضت منح الطفل 3 سنوات.");}
  save();render()
}
function render(){
  life.textContent=fmt(s.r);spent.textContent="دفعت حتى الآن: "+fmt(s.spent);
  shop.innerHTML="";
  items.forEach(it=>{
    let d=document.createElement("div");d.className="item";
    d.innerHTML=`<h3>${it[1]}</h3><div class="price">${it[3]} من عمرك</div><p>${it[4]}</p><button ${s.bought[it[0]]?"disabled":""} onclick="buy('${it[0]}')">${s.bought[it[0]]?"تم الشراء":"اشترِ بعمرك"}</button>`;
    shop.appendChild(d);
  });
  if(s.story!==null){
    choices.style.display="none";
    story.innerHTML=s.story
      ?"أخذت المرأة السنوات الثلاث. الطفل نجا، وقبل أن تغادر همست لك: <b>«لا تثق ببنك العمر.»</b>"
      :"رفضت. بعد دقائق تسمع إعلانًا في السوق: <b>«تم شراء 20 سنة مجهولة المصدر.»</b>";
  }
  log.innerHTML=s.log.slice().reverse().map(x=>"• "+x).join("<br>");
}
render();
</script>
</html>
