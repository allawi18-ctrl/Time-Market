<style>

@media(orientation:landscape){#dialog{left:18%;right:18%;bottom:15px}#hint{bottom:101px}.top{left:14px;right:14px}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

const MODEL_SOLDIER='https://cdn.jsdelivr.net/gh/mrdoob/three.js@r185/examples/models/gltf/Soldier.glb';
const START_DAYS=23*365+4*30+12;
const SAVE_KEY='time_market_build04';
let game=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')||{days:START_DAYS,seal:false,bank:false,black:false};
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(game))}
function fmt(d){let y=Math.floor(d/365);d-=y*365;let m=Math.floor(d/30);d-=m*30;return `${y} سنة و ${m} أشهر و ${Math.floor(d)} يوم`}

// RENDERER
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202631);scene.fog=new THREE.FogExp2(0x222832,.0165);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,160);camera.position.set(0,3.2,8);

// LIGHTING: intentionally brighter than old builds.
scene.add(new THREE.HemisphereLight(0xb7c8df,0x5d3d25,2.25));
const moon=new THREE.DirectionalLight(0xcbdcff,2.4);moon.position.set(-10,18,9);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-18;moon.shadow.camera.right=18;moon.shadow.camera.top=24;moon.shadow.camera.bottom=-8;scene.add(moon);
const warmLights=[];
function lantern(x,y,z,intensity=14){const l=new THREE.PointLight(0xffb24f,intensity,10,1.7);l.position.set(x,y,z);scene.add(l);warmLights.push(l);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),new THREE.MeshBasicMaterial({color:0xffca6b}));bulb.position.copy(l.position);scene.add(bulb);return l}
for(let z=0;z>-74;z-=8){lantern(-5.0,3.25,z-3,10.5);lantern(5.0,3.05,z-7,11.5)}

// MATERIALS
const roadMat=new THREE.MeshPhysicalMaterial({color:0x27303a,roughness:.18,metalness:.12,clearcoat:1,clearcoatRoughness:.12});
const pavementMat=new THREE.MeshStandardMaterial({color:0x4a4540,roughness:.82});
const plaster=[0x725d4b,0x5e5146,0x675a50,0x4d4f50].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.86}));
const woodMat=new THREE.MeshStandardMaterial({color:0x422817,roughness:.7});
const roofMat=new THREE.MeshStandardMaterial({color:0x342520,roughness:.88});
const metalMat=new THREE.MeshStandardMaterial({color:0x704a22,roughness:.36,metalness:.62});
const goldGlow=new THREE.MeshBasicMaterial({color:0xf0ba5b});
function meshBox(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}

// STREET
const road=new THREE.Mesh(new THREE.PlaneGeometry(11.2,88),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-35;road.receiveShadow=true;scene.add(road);
for(const x of [-6,6]){const p=meshBox(1.5,.24,88,pavementMat,x,.1,-35)}
// Wet irregular patches
for(let i=0;i<90;i++){const m=new THREE.Mesh(new THREE.CircleGeometry(.18+Math.random()*.7,10),new THREE.MeshPhysicalMaterial({color:0x465464,transparent:true,opacity:.18,roughness:.02,metalness:.2,clearcoat:1}));m.rotation.x=-Math.PI/2;m.position.set((Math.random()-.5)*9.2,.018,5-Math.random()*80);m.scale.y=.3+Math.random()*.7;scene.add(m)}

// Buildings with depth, windows, roofs, awnings.
function makeBuilding(side,z,index){
 const x=side*8.15,w=4.2+Math.random()*1.1,h=4.8+Math.random()*3.0,d=6.1;
 meshBox(w,h,d,plaster[index%plaster.length],x,h/2,z);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(3.4,1.9,4),roofMat);roof.position.set(x,h+1,z);roof.rotation.y=Math.PI/4;roof.scale.z=.9;roof.castShadow=true;scene.add(roof);
 // Street-facing timber facade (details face the player, not the hidden front/back wall).
 const facadeX=x-side*(w/2+.03);
 for(const oz of [-1.65,0,1.65]) meshBox(.16,h*.82,.16,woodMat,facadeX,.55+h*.4,z+oz);
 for(let yy=1.6;yy<h-1;yy+=1.7) meshBox(.17,.14,d*.76,woodMat,facadeX,yy,z);
 // warm/cool windows directly facing the street
 for(let yy=2;yy<h-1;yy+=2){for(const oz of [-1.3,1.3]){const win=new THREE.Mesh(new THREE.PlaneGeometry(.72,.9),new THREE.MeshBasicMaterial({color:index%3===0?0xffc46c:0x7998bd}));win.position.set(facadeX-side*.015,yy,z+oz);win.rotation.y=side>0?-Math.PI/2:Math.PI/2;scene.add(win)}}
 // market stall at street side
 const stallX=side*5.25;meshBox(2.6,1.15,1.0,woodMat,stallX,.58,z-side*2.0);meshBox(3.2,.14,1.9,metalMat,stallX,2.15,z-side*2.05);
 // hanging sign
 const sign=createSign(index%3===0?'سنوات للبيع':index%3===1?'تبادل العمر':'مزاد الزمن');sign.position.set(side*5.15,3.2,z-side*2.1);sign.rotation.y=side>0?-Math.PI/2:Math.PI/2;scene.add(sign);sign.userData.swing=Math.random()*6;movingSigns.push(sign);
}
function createSign(text){const c=document.createElement('canvas');c.width=512;c.height=170;const g=c.getContext('2d');g.fillStyle='#2a190d';g.fillRect(0,0,512,170);g.strokeStyle='#b47a35';g.lineWidth=8;g.strokeRect(8,8,496,154);g.fillStyle='#f2c36d';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';g.font='bold 47px Tahoma,Arial';g.fillText(text,256,87);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return new THREE.Mesh(new THREE.PlaneGeometry(2.6,.86),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}))}
const movingSigns=[];for(let i=0,z=0;z>-78;z-=8,i++){makeBuilding(-1,z-4,i);makeBuilding(1,z-7,i+1)}

// Market props: crates, barrels, hourglasses.
for(let i=0;i<30;i++){const side=Math.random()>.5?1:-1,x=side*(4.3+Math.random()*1.0),z=-2-Math.random()*73;if(i%2){const b=new THREE.Mesh(new THREE.CylinderGeometry(.34,.38,.75,12),woodMat);b.position.set(x,.38,z);b.castShadow=true;scene.add(b)}else meshBox(.65,.55,.65,woodMat,x,.28,z)}
function hourglass(x,y,z,s=.6){const g=new THREE.Group(),top=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.09,16),metalMat),bot=top.clone();top.position.y=.62;bot.position.y=-.62;const glass=new THREE.MeshPhysicalMaterial({color:0xffdfab,transparent:true,opacity:.35,roughness:.08,transmission:.2});const a=new THREE.Mesh(new THREE.ConeGeometry(.33,.54,16,1,true),glass);a.position.y=.28;a.rotation.x=Math.PI;const b=a.clone();b.position.y=-.28;b.rotation.x=0;g.add(top,bot,a,b);g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);return g}
const hourglasses=[];for(let z=-6;z>-70;z-=11){hourglasses.push(hourglass(-4.55,1.55,z,.55));hourglasses.push(hourglass(4.55,1.55,z-5,.52))}

// BANK at far end
const bank=new THREE.Group();bank.position.set(0,0,-75);scene.add(bank);
function bankBox(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;bank.add(m);return m}
bankBox(13,8,5,new THREE.MeshStandardMaterial({color:0x3d4146,roughness:.62}),0,4,0);bankBox(2,8.5,1.2,metalMat,-4.8,4.25,2.6);bankBox(2,8.5,1.2,metalMat,4.8,4.25,2.6);bankBox(7,1.5,1.2,metalMat,0,7.7,2.6);const door=bankBox(5,5.4,.45,new THREE.MeshStandardMaterial({color:0x181a1d,metalness:.55,roughness:.3}),0,2.7,2.72);const bsign=createSign('بنك العمر');bsign.scale.set(1.3,1.3,1.3);bsign.position.set(0,7.55,3.28);bank.add(bsign);lantern(-3.7,5.8,-71.5,18);lantern(3.7,5.8,-71.5,18);
// Floating objective marker: starts over the human trader, then moves to the bank.
const questMarker=new THREE.Group();const qRing=new THREE.Mesh(new THREE.TorusGeometry(.28,.055,8,22),goldGlow);qRing.rotation.x=Math.PI/2;const qCore=new THREE.Mesh(new THREE.OctahedronGeometry(.13),goldGlow);questMarker.add(qRing,qCore);questMarker.position.set(3.7,3.45,-14);questMarker.userData.baseY=3.45;scene.add(questMarker);

// Rain
const rainCount=1000,rainGeo=new THREE.BufferGeometry(),rp=new Float32Array(rainCount*3);for(let i=0;i<rainCount;i++){rp[i*3]=(Math.random()-.5)*22;rp[i*3+1]=Math.random()*14;rp[i*3+2]=8-Math.random()*92}rainGeo.setAttribute('position',new THREE.BufferAttribute(rp,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xc3d7e5,size:.035,transparent:true,opacity:.5}));scene.add(rain);
// Steam / mist particles
const steam=[];for(let i=0;i<26;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.18+Math.random()*.25,6,5),new THREE.MeshBasicMaterial({color:0xb9c5c9,transparent:true,opacity:.08,depthWrite:false}));p.position.set((Math.random()>.5?1:-1)*(4.5+Math.random()*.5),.3+Math.random(),-3-Math.random()*70);p.userData.base=p.position.y;p.userData.speed=.28+Math.random()*.25;scene.add(p);steam.push(p)}

// MODEL LOADING
const loader=new GLTFLoader();let soldierSource=null,soldierClips=[];const mixers=[];let player=null,playerMixer=null,playerActions={},activePlayerAction=null,merchant=null,merchantMixer=null;const crowd=[];
function setProgress(n,t){document.getElementById('loadfill').style.width=n+'%';document.getElementById('loadText').textContent=t}
function loadGLB(url){return new Promise((resolve,reject)=>loader.load(url,resolve,undefined,reject))}
function setupModel(root,scale=1,castShadows=true){root.scale.setScalar(scale);root.traverse(o=>{if(o.isMesh){o.castShadow=castShadows;o.receiveShadow=true;if(o.material){o.material=o.material.clone();o.material.roughness=Math.max(.45,o.material.roughness??.7)}}});return root}
function findClip(clips,name){return clips.find(c=>c.name.toLowerCase()===name.toLowerCase())||clips.find(c=>c.name.toLowerCase().includes(name.toLowerCase()))||clips[0]}
function makeHuman(source,clips,pos,scale,tint,anim='Idle',tintStrength=.28,castShadows=true){
 const root=setupModel(skeletonClone(source),scale,castShadows);root.position.copy(pos);scene.add(root);const mixer=new THREE.AnimationMixer(root);mixers.push(mixer);const clip=findClip(clips,anim);const action=clip?mixer.clipAction(clip):null;if(action)action.play();if(tint){root.traverse(o=>{if(o.isMesh&&o.material&&o.material.color){o.material.color.lerp(new THREE.Color(tint),tintStrength)}})}return {root,mixer,clips,action,current:anim}
}
function switchHuman(h,name){if(h.current===name)return;const clip=name==='Idle'?h.clips[0]:h.clips[3];if(!clip)return;const next=h.mixer.clipAction(clip);next.reset().fadeIn(.2).play();h.action?.fadeOut(.2);h.action=next;h.current=name}

async function loadHumans(){
 setProgress(18,'تحميل البطل البشري…');
 const s=await loadGLB(MODEL_SOLDIER);soldierSource=s.scene;soldierClips=s.animations;
 if(soldierClips.length<4)throw new Error('Human animation set incomplete');
 setProgress(48,'إنشاء التاجر وسكان السوق…');
 // Player: real skinned human; official Soldier clips are Idle[0], Run[1], Walk[3].
 player=setupModel(skeletonClone(soldierSource),1.03);player.position.set(0,0,4);scene.add(player);
 playerMixer=new THREE.AnimationMixer(player);mixers.push(playerMixer);
 playerActions.Idle=playerMixer.clipAction(soldierClips[0]);
 playerActions.Run=playerMixer.clipAction(soldierClips[1]);
 playerActions.Walk=playerMixer.clipAction(soldierClips[3]);
 activePlayerAction=playerActions.Idle;activePlayerAction.play();
 // Merchant: another real animated human, with a distinct warm/brown wardrobe tint and idle animation.
 const mh=makeHuman(soldierSource,soldierClips,new THREE.Vector3(3.7,0,-14),1.06,0x6b3d24,'Idle',.62,true);
 merchant=mh.root;merchantMixer=mh.mixer;merchant.rotation.y=-.55;
   // Dedicated merchant counter and glowing hourglass so the human trader reads clearly as a shopkeeper.
   meshBox(2.7,1.05,1.05,woodMat,3.72,.53,-12.75);hourglasses.push(hourglass(3.72,1.55,-12.7,.72));lantern(3.7,3.4,-12.4,15.5);
 // Human crowd. Shared geometry, separate skeletons/animation mixers, varied scale/tints and speeds.
 const colors=[0x704936,0x304b62,0x555235,0x643d49,0x354b5b,0x716346,0x354337,0x51455d];
 for(let i=0;i<9;i++){
   const h=makeHuman(soldierSource,soldierClips,new THREE.Vector3((i%2?1:-1)*(1.15+Math.random()*1.55),0,-3-Math.random()*62),.91+Math.random()*.10,colors[i%colors.length],'Walk',.34,false);
   h.root.userData.dir=Math.random()>.5?1:-1;h.root.userData.speed=.52+Math.random()*.50;h.root.userData.pausePhase=Math.random()*8;
   // Soldier's neutral forward is -Z, so +Z travel needs a 180-degree turn.
   h.root.rotation.y=h.root.userData.dir>0?Math.PI:0;
   crowd.push(h);
 }
 setProgress(88,'تهيئة السوق والمطر…');
}

// AUDIO: procedural ambience so the market feels alive without large audio downloads.
let audioCtx=null,stepAt=0;
function startAudio(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();const len=audioCtx.sampleRate*2,buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;const rainSrc=audioCtx.createBufferSource(),rainFilter=audioCtx.createBiquadFilter(),rainGain=audioCtx.createGain();rainSrc.buffer=buf;rainSrc.loop=true;rainFilter.type='lowpass';rainFilter.frequency.value=1500;rainGain.gain.value=.018;rainSrc.connect(rainFilter).connect(rainGain).connect(audioCtx.destination);rainSrc.start();const hum=audioCtx.createOscillator(),hg=audioCtx.createGain();hum.type='sine';hum.frequency.value=55;hg.gain.value=.008;hum.connect(hg).connect(audioCtx.destination);hum.start()}catch(e){audioCtx=null}}
function footstep(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type='triangle';o.frequency.setValueAtTime(95,now);o.frequency.exponentialRampToValueAtTime(48,now+.055);g.gain.setValueAtTime(.022,now);g.gain.exponentialRampToValueAtTime(.0001,now+.08);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.085)}

// UI + GAMEPLAY
let running=false,dialogOpen=false,inventoryOpen=false,sprinting=false,joy={x:0,y:0},cameraYaw=0,pointer=null,lookPointer=null,lookLastX=0,near=null,lastActionName='Idle';
const life=document.getElementById('life'),mission=document.getElementById('mission'),agefill=document.getElementById('agefill'),hint=document.getElementById('hint'),interact=document.getElementById('interact');
function updateHUD(){life.textContent=fmt(game.days);agefill.style.width=Math.max(4,game.days/START_DAYS*100)+'%';mission.textContent=!game.seal?'تحدث مع تاجر السنوات':!game.bank?'اذهب إلى بوابة بنك العمر':'اكتشف الحساب الذي يجمع أعمار الناس';if(typeof questMarker!=='undefined'){if(!game.seal){questMarker.visible=true;questMarker.position.set(3.7,3.45,-14);questMarker.userData.baseY=3.45}else if(!game.black){questMarker.visible=true;questMarker.position.set(0,8.9,-71.5);questMarker.userData.baseY=8.9}else questMarker.visible=false}}
function switchPlayerAction(name){if(name===lastActionName||!playerActions[name])return;const next=playerActions[name];next.reset().fadeIn(.16).play();activePlayerAction?.fadeOut(.16);activePlayerAction=next;lastActionName=name}
function openDialog(name,text,options){dialogOpen=true;document.getElementById('dialog').style.display='block';document.getElementById('speaker').textContent=name;document.getElementById('dialogText').innerHTML=text;const c=document.getElementById('choices');c.innerHTML='';options.forEach((o,i)=>{const b=document.createElement('button');b.className='choice '+(i===0?'main':'');b.textContent=o[0];b.onclick=o[1];c.appendChild(b)});hint.classList.remove('show')}
function closeDialog(){dialogOpen=false;document.getElementById('dialog').style.display='none'}
function loseYear(){game.days-=365;game.seal=true;save();updateHUD();const f=document.getElementById('flash'),l=document.getElementById('lost');f.style.opacity=.35;setTimeout(()=>f.style.opacity=0,180);l.classList.add('show');setTimeout(()=>l.classList.remove('show'),1400)}
function interactNow(){if(dialogOpen||inventoryOpen||!near)return;if(near==='merchant'){openDialog('تاجر السنوات','الختم الذي يسمح لك بدخول بنك العمر ثمنه <b style="color:#e7bd71">سنة واحدة من حياتك</b>.',[['ادفع سنة',()=>{if(!game.seal)loseYear();openDialog('تاجر السنوات','خذ الختم. عندما تصل إلى البنك، لا تقل لهم من باعك إياه.',[['خذ الختم',()=>closeDialog()]])}],['اسأله أين تذهب السنوات',()=>openDialog('تاجر السنوات','لو كنت أعرف لما بقيت أبيعها هنا. لكن كل الطرق تنتهي عند بنك العمر.',[['رجوع',()=>closeDialog()]])],['ابتعد',()=>closeDialog()]])}else if(near==='bank'){if(!game.seal)openDialog('حارس بنك العمر','الدخول ممنوع بدون ختم عبور.',[['ابتعد',()=>closeDialog()]]);else if(!game.bank)openDialog('حارس بنك العمر','ختمك حقيقي… لكن رقمه ممسوح من السجل.',[['أظهر الختم',()=>{game.bank=true;save();updateHUD();openDialog('حارس بنك العمر','هناك باب خلف البنك. لم أقل لك ذلك.',[['أكمل',()=>closeDialog()]])}],['ابتعد',()=>closeDialog()]]);else{game.black=true;save();updateHUD();openDialog('صوت من خلف البنك','هناك حساب واحد يستقبل سنوات آلاف الناس. صاحب الحساب لا يظهر اسمه لأي موظف.',[['أكمل',()=>closeDialog()]])}}}
interact.onclick=interactNow;
// inventory
document.getElementById('bag').onclick=()=>{inventoryOpen=true;document.getElementById('inventory').style.display='block';let a=[];if(game.seal)a.push('<div class="item"><b>ختم عبور بنك العمر</b><br><span style="color:#b4bac3">دفعته بسنة من عمرك.</span></div>');if(game.bank)a.push('<div class="item"><b>معلومة الحارس</b><br><span style="color:#b4bac3">هناك باب مخفي خلف البنك.</span></div>');if(game.black)a.push('<div class="item"><b>الحساب الواحد</b><br><span style="color:#b4bac3">حساب مجهول يجمع سنوات آلاف الناس.</span></div>');if(!a.length)a.push('<div class="item" style="color:#b4bac3">المخزون فارغ.</div>');document.getElementById('invlist').innerHTML=a.join('')};document.getElementById('closeInv').onclick=()=>{inventoryOpen=false;document.getElementById('inventory').style.display='none'};
document.getElementById('run').onclick=()=>{sprinting=!sprinting;document.getElementById('run').classList.toggle('on',sprinting);document.getElementById('run').textContent=sprinting?'ركض ✓':'ركض'};
// joystick
const J=document.getElementById('joy'),stick=document.getElementById('stick');function joyPos(x,y){const r=J.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,L=42;let dx=x-cx,dy=y-cy,m=Math.hypot(dx,dy);if(m>L){dx=dx/m*L;dy=dy/m*L}joy.x=dx/L;joy.y=dy/L;stick.style.transform=`translate(${dx}px,${dy}px)`}J.onpointerdown=e=>{pointer=e.pointerId;J.setPointerCapture(e.pointerId);joyPos(e.clientX,e.clientY);e.preventDefault()};J.onpointermove=e=>{if(e.pointerId===pointer){joyPos(e.clientX,e.clientY);e.preventDefault()}};function stopJoy(e){if(pointer===null||e.pointerId===pointer){pointer=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}}J.onpointerup=stopJoy;J.onpointercancel=stopJoy;
// camera look on right half of screen
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.42){lookPointer=e.pointerId;lookLastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===lookPointer){const dx=e.clientX-lookLastX;lookLastX=e.clientX;cameraYaw-=dx*.005}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookPointer)lookPointer=null});

const clock=new THREE.Clock();let camPos=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta()),t=performance.now()/1000;for(const m of mixers)m.update(dt);
 // lights, props and atmosphere
 warmLights.forEach((l,i)=>l.intensity=10.8+Math.sin(t*7+i*1.5)*.7+Math.sin(t*17+i)*.2);questMarker.rotation.y+=dt*.9;if(questMarker.visible)questMarker.position.y=questMarker.userData.baseY+Math.sin(t*2.2)*.08;movingSigns.forEach(s=>s.rotation.z=Math.sin(t*.8+s.userData.swing)*.045);hourglasses.forEach((h,i)=>h.rotation.y+=dt*(.22+(i%3)*.04));steam.forEach(p=>{p.position.y+=dt*p.userData.speed;p.material.opacity=.03+.08*Math.max(0,1-(p.position.y-p.userData.base)/2.5);if(p.position.y>p.userData.base+2.5)p.position.y=p.userData.base});for(let i=0;i<rainCount;i++){rp[i*3+1]-=dt*(8+(i%7)*.4);rp[i*3]-=dt*.7;if(rp[i*3+1]<0){rp[i*3+1]=14;rp[i*3]=(Math.random()-.5)*22}}rain.geometry.attributes.position.needsUpdate=true;
 // crowd locomotion actual animated humans
 for(const h of crowd){const walking=((t+h.root.userData.pausePhase)%8)<6.1;switchHuman(h,walking?'Walk':'Idle');if(walking){h.root.position.z+=h.root.userData.dir*h.root.userData.speed*dt;if(h.root.position.z>5){h.root.position.z=-70;h.root.userData.dir=1;h.root.rotation.y=Math.PI}else if(h.root.position.z<-72){h.root.position.z=4;h.root.userData.dir=-1;h.root.rotation.y=0}}}
 if(running&&player&&!dialogOpen&&!inventoryOpen){const moving=Math.abs(joy.x)+Math.abs(joy.y)>.07;if(moving){const speed=sprinting?6.4:3.55;const camForward=new THREE.Vector3(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));const camRight=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));const mv=camForward.multiplyScalar(-joy.y).add(camRight.multiplyScalar(joy.x));if(mv.lengthSq()>.001){mv.normalize();const next=player.position.clone().addScaledVector(mv,speed*dt);next.x=THREE.MathUtils.clamp(next.x,-4.35,4.35);next.z=THREE.MathUtils.clamp(next.z,-70,5);/* don't walk through the trader's counter */const hitsCounter=next.x>2.15&&next.x<4.35&&next.z<-11.75&&next.z>-13.75;if(!hitsCounter)player.position.copy(next);if(t-stepAt>(sprinting?.28:.42)){footstep();stepAt=t;}const targetRot=Math.atan2(-mv.x,-mv.z);let diff=THREE.MathUtils.euclideanModulo(targetRot-player.rotation.y+Math.PI,Math.PI*2)-Math.PI;player.rotation.y+=diff*Math.min(1,dt*9);switchPlayerAction(sprinting?'Run':'Walk')}}else switchPlayerAction('Idle')}
 // interaction ranges
 near=null;if(player&&merchant&&player.position.distanceTo(merchant.position)<3.0)near='merchant';const bankWorld=new THREE.Vector3(0,0,-70);if(player&&player.position.distanceTo(bankWorld)<4.5)near='bank';interact.classList.toggle('ready',!!near);hint.classList.toggle('show',!!near&&!dialogOpen&&!inventoryOpen);
 // zone
 if(player){document.getElementById('zone').textContent=player.position.z<-55?'بنك العمر — الساحة الأمامية':player.position.z<-28?'سوق العمر — الممر الداخلي':'سوق العمر — شارع المصابيح';
 // camera follow with independent look offset
 const desired=player.position.clone().add(new THREE.Vector3(Math.sin(cameraYaw)*4.6,2.8,Math.cos(cameraYaw)*4.6));camera.position.lerp(desired,1-Math.pow(.002,dt));camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.45,0)))}
 renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.55))});

// LOAD + START
(async()=>{try{setProgress(8,'تحميل البيئة…');await new Promise(r=>setTimeout(r,120));await loadHumans();setProgress(100,'جاهز');updateHUD();document.getElementById('startBtn').style.display='block'}catch(err){console.error(err);document.getElementById('errorBox').style.display='block';document.getElementById('errorBox').textContent='تعذر تحميل النماذج ثلاثية الأبعاد. تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.';document.getElementById('loadText').textContent='حدث خطأ في التحميل'}})();
document.getElementById('startBtn').onclick=()=>{document.getElementById('loading').style.display='none';running=true;startAudio();updateHUD()};
updateHUD();
window.__TM_TEST__={getState:()=>({...game}),fmt,MODEL_SOLDIER,getCounts:()=>({crowd:crowd.length,mixers:mixers.length,hourglasses:hourglasses.length,lights:warmLights.length}),getRuntime:()=>({playerLoaded:!!player,merchantLoaded:!!merchant,near,cameraYaw})};
