<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050607">
<title>سوق العمر — Build 03 3D</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
  }
}
</script>

<style>
:root{
 --gold:#e8b95f;--gold2:#9f6d28;--text:#f6f0e4;--muted:#aeb4bd;
 --panel:rgba(8,11,16,.86);--line:rgba(236,190,104,.34)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button{font:inherit}
#app{position:fixed;inset:0;background:#050607;touch-action:none}
canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at 50% 35%,#24180c,#060709 48%,#020304);transition:.5s}
.loadbox{width:min(520px,88%);padding:26px;text-align:center;background:#0b0f15e8;border:1px solid #57401f;border-radius:20px}
.loadbox h1{margin:0;color:#e7b65c;font-size:40px}.loadbox p{color:#b9b1a4;line-height:1.7}.loadbar{height:6px;background:#20242b;border-radius:99px;overflow:hidden}
#loadfill{height:100%;width:0;background:linear-gradient(90deg,#8b5a21,#f0c875);transition:.25s}
#startBtn{display:none;margin-top:16px;width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(#dfae52,#a36f2b);font-weight:900;font-size:18px;color:#171008}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:9px}
.card{background:linear-gradient(180deg,rgba(17,21,28,.93),rgba(7,10,15,.88));border:1px solid var(--line);
border-radius:17px;backdrop-filter:blur(11px);box-shadow:0 10px 28px #0008}
.life{padding:9px 12px;min-width:205px}.life small,.mission small{font-size:11px;color:#b9ae98}
.life b{display:block;color:#f2d08b;font-size:17px;margin-top:1px}
.agebar{height:4px;background:#252a31;border-radius:99px;overflow:hidden;margin-top:6px}
#agefill{height:100%;width:100%;background:linear-gradient(90deg,#76501f,#efc777)}
.mission{padding:9px 12px;flex:1;max-width:400px}.mission b{display:block;font-size:14px;margin-top:2px}

#zone{position:absolute;top:96px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:99px;
background:#0a1017df;border:1px solid #48545f;color:#e8e3da;font-size:12px;font-weight:900;white-space:nowrap}
#hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:9px 13px;border-radius:13px;
background:#0a1017ec;border:1px solid #566270;font-size:13px;font-weight:900;white-space:nowrap;opacity:0;transition:.15s}
#hint.show{opacity:1}

#joy{position:absolute;left:18px;bottom:max(25px,env(safe-area-inset-bottom));width:138px;height:138px;border-radius:50%;
background:radial-gradient(circle,#2c251bc9,#080c11d9 72%);border:1px solid #ddb05f99;box-shadow:inset 0 0 30px #000b,0 10px 28px #0009;
pointer-events:auto;touch-action:none}
#stick{position:absolute;left:40px;top:40px;width:58px;height:58px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#edc46e,#8e632c 62%,#302517);border:1px solid #ffe0a0;box-shadow:0 0 24px #e6b35b55}
.arrow{position:absolute;color:#e8c27488;font-size:21px;font-weight:900}.up{left:59px;top:4px}.down{left:59px;bottom:2px}.left{left:6px;top:57px}.right{right:6px;top:57px}

#run{position:absolute;left:164px;bottom:max(43px,env(safe-area-inset-bottom));width:76px;height:51px;border-radius:15px;
background:#10161ddb;border:1px solid #59636e;color:white;font-size:13px;font-weight:900;pointer-events:auto}
#run.on{background:#95672a;border-color:#efc36c}
#interact{position:absolute;right:19px;bottom:max(33px,env(safe-area-inset-bottom));width:124px;height:80px;border-radius:24px;
background:linear-gradient(#dfae53,#a6732d);border:1px solid #f3d08a;color:#171008;font-size:18px;font-weight:900;pointer-events:auto;
opacity:.35;transition:.18s;box-shadow:0 10px 28px #0009}
#interact.ready{opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 9px #e6b55b10,0 10px 28px #0009}}
#bag{position:absolute;right:27px;bottom:128px;width:68px;height:68px;border-radius:50%;background:#0c1219e9;border:1px solid #d9ad5b88;color:#efc87c;font-size:27px;pointer-events:auto}

#dialog{position:absolute;left:13px;right:13px;bottom:123px;padding:15px;display:none;pointer-events:auto;z-index:12}
#speaker{color:var(--gold);font-size:17px;font-weight:900}
#dialogText{font-size:17px;line-height:1.75;margin-top:6px}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.choice{min-height:47px;border-radius:12px;border:1px solid #3b4552;background:#19222c;color:white;font-weight:900}
.choice.main{background:linear-gradient(#d6a64b,#9d6c2a);border-color:#eac16b;color:#171008}

#inventory{position:absolute;left:18px;right:18px;top:17%;padding:17px;display:none;pointer-events:auto;z-index:13}
#inventory h2{margin:0;color:#e7b962}.item{padding:11px;border-radius:12px;border:1px solid #333d48;background:#121923;margin-top:8px}
.close{width:100%;margin-top:11px;padding:12px;border-radius:12px;background:#19212b;color:#fff;border:1px solid #424c57;font-weight:900}

#flash{position:fixed;inset:0;background:#efd09a;opacity:0;pointer-events:none;z-index:25;transition:.15s}
#lost{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.82);opacity:0;z-index:26;color:#f2c779;font-size:38px;font-weight:900;text-shadow:0 7px 30px #000;transition:.3s;pointer-events:none}
#lost.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:.4s}
@media(orientation:landscape){#dialog{left:18%;right:18%;bottom:16px}#hint{bottom:104px}}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
 <div class="top">
  <div class="life card"><small>العمر المتبقي</small><b id="life">23 سنة</b><div class="agebar"><div id="agefill"></div></div></div>
  <div class="mission card"><small>المهمة الحالية</small><b id="mission">ادخل السوق وابحث عن تاجر السنوات</b></div>
 </div>
 <div id="zone">سوق العمر — البوابة الرئيسية</div>
 <div id="hint">اضغط «تفاعل»</div>

 <div id="joy"><span class="arrow up">↑</span><span class="arrow down">↓</span><span class="arrow left">←</span><span class="arrow right">→</span><div id="stick"></div></div>
 <button id="run">ركض</button>
 <button id="bag">⌛</button>
 <button id="interact">تفاعل</button>

 <div id="dialog" class="card"><div id="speaker"></div><div id="dialogText"></div><div id="choices"></div></div>
 <div id="inventory" class="card"><h2>المخزون</h2><div id="invlist"></div><button id="closeInv" class="close">إغلاق</button></div>
</div>

<div id="loading">
 <div class="loadbox">
  <h1>سوق العمر</h1>
  <p>Build 03 — بيئة 3D متحركة بالكامل</p>
  <div class="loadbar"><div id="loadfill"></div></div>
  <button id="startBtn">ابدأ اللعب</button>
 </div>
</div>

<div id="flash"></div><div id="lost">− سنة من عمرك</div><div id="fade"></div>

<script type="module">
import * as THREE from 'three';

const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050607);
scene.fog=new THREE.FogExp2(0x07090c,0.027);

const camera=new THREE.PerspectiveCamera(61,innerWidth/innerHeight,.1,150);
camera.position.set(0,3.4,7.2);

// ---------- lights ----------
const hemi=new THREE.HemisphereLight(0x61728c,0x170d06,1.05);scene.add(hemi);
const moon=new THREE.DirectionalLight(0x9ab8df,1.55);moon.position.set(-12,18,8);moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-24;moon.shadow.camera.right=24;moon.shadow.camera.top=28;moon.shadow.camera.bottom=-8;scene.add(moon);

function lantern(x,y,z,intensity=8){
 const l=new THREE.PointLight(0xffad43,intensity,8,1.8);l.position.set(x,y,z);scene.add(l);return l
}
const flickerLights=[];
for(let z=-5;z>-62;z-=8){
 flickerLights.push(lantern(-4.9,3.2,z,5.4));
 flickerLights.push(lantern(4.9,3.0,z-3.5,5.8));
}

// ---------- materials ----------
const matRoad=new THREE.MeshStandardMaterial({color:0x11151a,roughness:.28,metalness:.18});
const matStone=new THREE.MeshStandardMaterial({color:0x1a1714,roughness:.76});
const matWood=new THREE.MeshStandardMaterial({color:0x28180d,roughness:.65});
const matBlack=new THREE.MeshStandardMaterial({color:0x0c0d10,roughness:.52,metalness:.22});
const matGold=new THREE.MeshStandardMaterial({color:0x9c6625,roughness:.32,metalness:.62});
const matCloth=new THREE.MeshStandardMaterial({color:0x171a20,roughness:.88});
const matSkin=new THREE.MeshStandardMaterial({color:0x785443,roughness:.86});
const matGlow=new THREE.MeshBasicMaterial({color:0xf0b85a});
const matBlueGlow=new THREE.MeshBasicMaterial({color:0x7587ff});

// ---------- street ----------
const road=new THREE.Mesh(new THREE.PlaneGeometry(11,78),matRoad);road.rotation.x=-Math.PI/2;road.position.z=-28;road.receiveShadow=true;scene.add(road);
for(let i=0;i<65;i++){
 const p=new THREE.Mesh(new THREE.BoxGeometry(.55,.018,.85),new THREE.MeshStandardMaterial({color:0x1a2026,roughness:.14,metalness:.18}));
 p.position.set((Math.random()-.5)*8.4,.014,-Math.random()*68+3);p.rotation.y=(Math.random()-.5)*.25;scene.add(p);
}
for(const x of [-5.6,5.6]){
 const s=new THREE.Mesh(new THREE.BoxGeometry(1.3,.22,78),matStone);s.position.set(x,.08,-28);s.receiveShadow=true;scene.add(s);
}

// ---------- buildings / stalls ----------
const interactive=[];
function box(w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m
}
function sign(text,x,y,z,side=1){
 const c=document.createElement('canvas');c.width=512;c.height=180;
 const g=c.getContext('2d');g.fillStyle='#120e09';g.fillRect(0,0,c.width,c.height);
 g.strokeStyle='#ae7431';g.lineWidth=8;g.strokeRect(8,8,496,164);
 g.fillStyle='#f1be62';g.textAlign='center';g.textBaseline='middle';g.font='bold 54px Tahoma,Arial';
 g.fillText(text,256,92);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(3.5,1.25),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
 m.position.set(x,y,z);m.rotation.y=side>0?-Math.PI/2:Math.PI/2;scene.add(m);return m
}
for(let i=0;i<8;i++){
 const z=-5-i*8;
 const h=4+Math.random()*4;
 box(4.2,h,6.0,matBlack,-7.2,h/2,z);
 box(4.4,h+1,6.2,matBlack,7.3,(h+1)/2,z-3.4);
 box(3.4,2.0,2.3,matWood,-5.5,1.0,z+1.3);
 box(3.4,2.1,2.3,matWood,5.5,1.05,z-2.1);
 sign(i%2?'بيع الساعات':'سوق العمر',-5.34,2.9,z+.8,-1);
 sign(i%2?'السنوات':'مقايضة الزمن',5.34,3.0,z-2.5,1);
}

// ---------- lantern props ----------
function hourglass(x,y,z,s=.45){
 const group=new THREE.Group();
 const top=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.09,16),matGold);top.position.y=.62;
 const bot=top.clone();bot.position.y=-.62;
 const glass1=new THREE.Mesh(new THREE.ConeGeometry(.34,.55,16,1,true),new THREE.MeshPhysicalMaterial({color:0xf5d89d,transparent:true,opacity:.32,roughness:.05,transmission:.2}));
 glass1.position.y=.28;glass1.rotation.x=Math.PI;
 const glass2=glass1.clone();glass2.position.y=-.28;glass2.rotation.x=0;
 group.add(top,bot,glass1,glass2);group.position.set(x,y,z);group.scale.setScalar(s);scene.add(group);return group
}
const spinning=[];
for(let z=-8;z>-60;z-=10){spinning.push(hourglass(-4.8,2.2,z,.55));spinning.push(hourglass(4.7,2.0,z-4,.48))}

// ---------- player ----------
function humanoid(mainColor=0x15191f,skin=0x74513f){
 const g=new THREE.Group();
 const coatMat=new THREE.MeshStandardMaterial({color:mainColor,roughness:.85});
 const skinMat=new THREE.MeshStandardMaterial({color:skin,roughness:.9});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.46,1.25,4,8),coatMat);body.position.y=1.4;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,14,12),skinMat);head.position.y=2.55;head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.36,12,10,0,Math.PI*2,0,Math.PI*.65),new THREE.MeshStandardMaterial({color:0x08090a,roughness:1}));hair.position.y=2.72;g.add(hair);
 const legGeo=new THREE.CapsuleGeometry(.14,.72,3,6),legMat=coatMat;
 const l1=new THREE.Mesh(legGeo,legMat),l2=l1.clone();l1.position.set(-.22,.45,0);l2.position.set(.22,.45,0);g.add(l1,l2);
 const armGeo=new THREE.CapsuleGeometry(.12,.72,3,6);
 const a1=new THREE.Mesh(armGeo,coatMat),a2=a1.clone();a1.position.set(-.54,1.5,0);a2.position.set(.54,1.5,0);g.add(a1,a2);
 g.userData={body,head,l1,l2,a1,a2};return g
}
const player=humanoid(0x12171f);player.position.set(0,0,3);scene.add(player);

// backpack hourglass
const pack=hourglass(0,0,0,.34);scene.remove(pack);player.add(pack);pack.position.set(0,1.55,.47);pack.rotation.x=.12;

// ---------- merchant ----------
const merchant=humanoid(0x17120e,0x6b4a38);merchant.position.set(3.9,0,-13);merchant.rotation.y=-.35;scene.add(merchant);
const mask=new THREE.Mesh(new THREE.SphereGeometry(.345,14,12),new THREE.MeshStandardMaterial({color:0x4c341d,metalness:.72,roughness:.24}));mask.scale.z=.8;mask.position.set(0,2.56,-.12);merchant.add(mask);
const merchantCounter=box(3.1,1.25,1.25,matWood,3.9,.62,-11.8);
interactive.push({name:'merchant',obj:merchant,position:new THREE.Vector3(3.2,0,-10.4),radius:2.5});

// ---------- bank gate ----------
const bankGate=new THREE.Group();bankGate.position.set(0,0,-47);scene.add(bankGate);
const pillarL=new THREE.Mesh(new THREE.BoxGeometry(2.2,7,2.6),matBlack);pillarL.position.set(-4,3.5,0);bankGate.add(pillarL);
const pillarR=pillarL.clone();pillarR.position.x=4;bankGate.add(pillarR);
const arch=new THREE.Mesh(new THREE.BoxGeometry(10,1.8,2.7),matBlack);arch.position.set(0,6.3,0);bankGate.add(arch);
const gate=new THREE.Mesh(new THREE.BoxGeometry(5.2,5.2,.4),matGold);gate.position.set(0,2.6,.2);bankGate.add(gate);
const gateInner=new THREE.Mesh(new THREE.BoxGeometry(4.6,4.7,.44),matBlack);gateInner.position.set(0,2.6,.42);bankGate.add(gateInner);
sign('بنك العمر',0,7.6,-46.6,1).rotation.y=0;
interactive.push({name:'bank',obj:bankGate,position:new THREE.Vector3(0,0,-42),radius:3.1});

// ---------- moving NPCs ----------
const npcs=[];
for(let i=0;i<14;i++){
 const n=humanoid([0x24252a,0x252019,0x20252a,0x1c1d20][i%4],[0x604230,0x795744,0x4f382b][i%3]);
 const lane=(i%2?1:-1)*(1.3+Math.random()*2.7);
 n.position.set(lane,0,-3-Math.random()*56);
 n.scale.setScalar(.82+Math.random()*.16);
 n.userData.dir=Math.random()>.5?1:-1;n.userData.speed=.45+Math.random()*.45;n.userData.phase=Math.random()*Math.PI*2;
 if(n.userData.dir<0)n.rotation.y=Math.PI;
 scene.add(n);npcs.push(n);
}

// ---------- hanging moving signs ----------
const hangers=[];
for(let z=-10;z>-57;z-=12){
 const chainMat=new THREE.MeshStandardMaterial({color:0x503923,metalness:.6,roughness:.45});
 const pivot=new THREE.Group();pivot.position.set((Math.random()>.5?1:-1)*3.4,4.6,z);scene.add(pivot);
 const s=new THREE.Mesh(new THREE.BoxGeometry(1.9,.95,.12),new THREE.MeshStandardMaterial({color:0x20140a,metalness:.15,roughness:.55,emissive:0x4a2406,emissiveIntensity:.55}));
 s.position.y=-.7;pivot.add(s);hangers.push({pivot,phase:Math.random()*6});
}

// ---------- steam ----------
const steam=[];
const steamMat=new THREE.MeshBasicMaterial({color:0xa7b2b5,transparent:true,opacity:.10,depthWrite:false});
for(let i=0;i<18;i++){
 const p=new THREE.Mesh(new THREE.SphereGeometry(.22+Math.random()*.18,6,5),steamMat.clone());
 p.position.set((Math.random()>.5?1:-1)*(4.6+Math.random()*.6),.35+Math.random()*1.4,-5-Math.random()*51);
 p.userData.base=p.position.y;p.userData.speed=.25+Math.random()*.3;p.userData.phase=Math.random()*6;scene.add(p);steam.push(p);
}

// ---------- rain ----------
const rainCount=850;
const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){rainPos[i*3]=(Math.random()-.5)*22;rainPos[i*3+1]=Math.random()*13;rainPos[i*3+2]=5-Math.random()*75}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rainMat=new THREE.PointsMaterial({color:0xaac0d2,size:.035,transparent:true,opacity:.48});
const rain=new THREE.Points(rainGeo,rainMat);scene.add(rain);

// ---------- game state ----------
const START=23*365+4*30+12;
let GS=JSON.parse(localStorage.getItem('tm_build03')||'null')||{days:START,deal:false,seal:false,bank:false,black:false};
let running=false,dialog=false,inventory=false,sprint=false,joy={x:0,y:0},near=null,pointer=null,last=performance.now();
const life=document.getElementById('life'),mission=document.getElementById('mission'),agefill=document.getElementById('agefill'),hint=document.getElementById('hint'),act=document.getElementById('interact');
function save(){localStorage.setItem('tm_build03',JSON.stringify(GS))}
function fmt(d){let y=Math.floor(d/365);d-=y*365;let m=Math.floor(d/30);d-=m*30;return `${y} سنة و ${m} أشهر و ${Math.floor(d)} يوم`}
function updateHUD(){
 life.textContent=fmt(GS.days);agefill.style.width=Math.max(4,GS.days/START*100)+'%';
 mission.textContent=!GS.deal?'اعثر على تاجر السنوات':!GS.bank?'اذهب إلى بوابة بنك العمر':!GS.black?'ابحث عن مدخل السوق السوداء':'تم فتح السوق السوداء';
}
function openDialog(name,text,opts){
 dialog=true;document.getElementById('dialog').style.display='block';hint.classList.remove('show');
 document.getElementById('speaker').textContent=name;document.getElementById('dialogText').innerHTML=text;
 const c=document.getElementById('choices');c.innerHTML='';
 opts.forEach((o,i)=>{const b=document.createElement('button');b.className='choice '+(i===0?'main':'');b.textContent=o[0];b.onclick=o[1];c.appendChild(b)})
}
function closeDialog(){dialog=false;document.getElementById('dialog').style.display='none'}
function loseYear(){
 GS.days-=365;GS.deal=true;GS.seal=true;save();updateHUD();
 const f=document.getElementById('flash'),l=document.getElementById('lost');f.style.opacity=.35;setTimeout(()=>f.style.opacity=0,170);l.classList.add('show');setTimeout(()=>l.classList.remove('show'),1400)
}
function interactNow(){
 if(dialog||inventory||!near)return;
 if(near==='merchant'){
  openDialog('تاجر السنوات','ختم عبور بنك العمر ثمنه <b style="color:#e7ba68">سنة كاملة من حياتك</b>.',[
   ['ادفع سنة',()=>{loseYear();openDialog('تاجر السنوات','الآن تستطيع المرور من بوابة البنك. لا تقل للحارس من أين أخذت الختم.',[['خذ الختم',()=>closeDialog()]])}],
   ['اسأله عن البنك',()=>openDialog('تاجر السنوات','البنك لا يصنع الوقت. هو يجمعه من الناس… ثم يرسله إلى مكان لا يعرفه أحد.',[['رجوع',()=>closeDialog()]])],
   ['ابتعد',()=>closeDialog()]
  ])
 }else if(near==='bank'){
  if(!GS.seal){openDialog('حارس بنك العمر','لا يمكنك الدخول دون ختم عبور.',[['ابتعد',()=>closeDialog()]])}
  else if(!GS.bank){openDialog('حارس بنك العمر','هذا الختم غير موجود في سجلاتنا.',[
   ['أظهر الختم',()=>{GS.bank=true;save();updateHUD();openDialog('حارس بنك العمر','مزور… لكن من صنعه يعرف الممر الخلفي للبنك.',[['أكمل',()=>closeDialog()]])}],
   ['ابتعد',()=>closeDialog()]
  ])}else{
   GS.black=true;save();updateHUD();openDialog('صوت خلف البوابة','هناك حساب واحد يستقبل أعمار آلاف الأشخاص. إذا أردت اسمه… ابحث عن الباب الأسود خلف البنك.',[['أكمل',()=>closeDialog()]])
  }
 }
}
act.onclick=interactNow;

// Inventory
document.getElementById('bag').onclick=()=>{
 inventory=true;document.getElementById('inventory').style.display='block';
 let a=[];if(GS.seal)a.push('<div class="item"><b>ختم عبور بنك العمر</b><br><span style="color:#aeb4bd">اشتريته بسنة من حياتك.</span></div>');
 if(GS.bank)a.push('<div class="item"><b>سر الحارس</b><br><span style="color:#aeb4bd">الختم مزور ويقود إلى ممر خلفي.</span></div>');
 if(GS.black)a.push('<div class="item"><b>الحساب الواحد</b><br><span style="color:#aeb4bd">حساب مجهول يجمع أعمار آلاف الناس.</span></div>');
 if(!a.length)a.push('<div class="item" style="color:#aeb4bd">المخزون فارغ.</div>');document.getElementById('invlist').innerHTML=a.join('')
};
document.getElementById('closeInv').onclick=()=>{inventory=false;document.getElementById('inventory').style.display='none'};
document.getElementById('run').onclick=()=>{sprint=!sprint;document.getElementById('run').classList.toggle('on',sprint);document.getElementById('run').textContent=sprint?'ركض ✓':'ركض'};

// joystick
const J=document.getElementById('joy'),stick=document.getElementById('stick');
function joyPos(x,y){const r=J.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,L=44;let dx=x-cx,dy=y-cy,m=Math.hypot(dx,dy);if(m>L){dx=dx/m*L;dy=dy/m*L}joy.x=dx/L;joy.y=dy/L;stick.style.transform=`translate(${dx}px,${dy}px)`}
J.onpointerdown=e=>{pointer=e.pointerId;J.setPointerCapture(e.pointerId);joyPos(e.clientX,e.clientY);e.preventDefault()};
J.onpointermove=e=>{if(e.pointerId===pointer){joyPos(e.clientX,e.clientY);e.preventDefault()}};
function stop(e){if(pointer===null||e.pointerId===pointer){pointer=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}}
J.onpointerup=stop;J.onpointercancel=stop;

// ---------- loop ----------
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(.04,clock.getDelta()),t=performance.now()/1000;

 // NPC walking
 for(const n of npcs){
   n.position.z+=n.userData.dir*n.userData.speed*dt;
   if(n.position.z>3){n.position.z=-61;n.userData.dir=1;n.rotation.y=0}
   if(n.position.z<-63){n.position.z=2;n.userData.dir=-1;n.rotation.y=Math.PI}
   const u=n.userData,phase=t*5*u.speed+u.phase;
   u.l1.rotation.x=Math.sin(phase)*.32;u.l2.rotation.x=-Math.sin(phase)*.32;u.a1.rotation.x=-Math.sin(phase)*.24;u.a2.rotation.x=Math.sin(phase)*.24;
 }

 for(const h of hangers)h.pivot.rotation.z=Math.sin(t*.8+h.phase)*.055;
 for(let i=0;i<flickerLights.length;i++)flickerLights[i].intensity=5.2+Math.sin(t*6+i*1.7)*.55+Math.sin(t*14+i)*.18;
 for(const s of spinning)s.rotation.y+=dt*.4;
 for(const p of steam){p.position.y+=dt*p.userData.speed;p.material.opacity=.04+.08*(1-Math.min(1,(p.position.y-p.userData.base)/2.8));p.scale.setScalar(1+(p.position.y-p.userData.base)*.18);if(p.position.y>p.userData.base+2.8){p.position.y=p.userData.base;p.scale.setScalar(1)}}
 const rp=rain.geometry.attributes.position.array;
 for(let i=0;i<rainCount;i++){rp[i*3+1]-=dt*(8+(i%7)*.35);rp[i*3]+=-dt*.6;if(rp[i*3+1]<0){rp[i*3+1]=12;rp[i*3]=(Math.random()-.5)*22}}
 rain.geometry.attributes.position.needsUpdate=true;

 if(running&&!dialog&&!inventory){
   const moving=Math.abs(joy.x)+Math.abs(joy.y)>.08;
   if(moving){
     const speed=sprint?7.0:4.2;
     const forward=new THREE.Vector3(-Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y));
     const right=new THREE.Vector3(Math.cos(player.rotation.y),0,-Math.sin(player.rotation.y));
     const move=forward.multiplyScalar(-joy.y).add(right.multiplyScalar(joy.x));
     if(move.lengthSq()>.001){
       move.normalize();player.position.addScaledVector(move,speed*dt);
       player.position.x=THREE.MathUtils.clamp(player.position.x,-4.4,4.4);
       player.position.z=THREE.MathUtils.clamp(player.position.z,-44,4.2);
       player.rotation.y=Math.atan2(-move.x,-move.z);
       const u=player.userData,phase=t*(sprint?10:7);
       u.l1.rotation.x=Math.sin(phase)*.42;u.l2.rotation.x=-Math.sin(phase)*.42;u.a1.rotation.x=-Math.sin(phase)*.30;u.a2.rotation.x=Math.sin(phase)*.30;
     }
   }else{
     const u=player.userData;u.l1.rotation.x*=.75;u.l2.rotation.x*=.75;u.a1.rotation.x*=.75;u.a2.rotation.x*=.75;
   }
 }

 // interaction detection
 near=null;let best=999;
 for(const it of interactive){const d=player.position.distanceTo(it.position);if(d<it.radius&&d<best){near=it.name;best=d}}
 act.classList.toggle('ready',!!near);hint.classList.toggle('show',!!near&&!dialog&&!inventory);

 // zone label
 document.getElementById('zone').textContent=player.position.z<-35?'بنك العمر — الساحة الخارجية':player.position.z<-18?'سوق العمر — الممر العميق':'سوق العمر — الممر الرئيسي';

 // camera follow
 const behind=new THREE.Vector3(Math.sin(player.rotation.y)*4.9,3.15,Math.cos(player.rotation.y)*4.9);
 const targetPos=player.position.clone().add(behind);
 camera.position.lerp(targetPos,1-Math.pow(.001,dt));
 const look=player.position.clone().add(new THREE.Vector3(0,1.55,0));
 camera.lookAt(look);

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});

// loading/start
let pct=0;const fillLoad=document.getElementById('loadfill'),startBtn=document.getElementById('startBtn');
const timer=setInterval(()=>{pct+=14+Math.random()*18;if(pct>=100){pct=100;clearInterval(timer);startBtn.style.display='block'}fillLoad.style.width=Math.min(100,pct)+'%'},160);
startBtn.onclick=()=>{document.getElementById('loading').style.opacity=0;setTimeout(()=>document.getElementById('loading').style.display='none',500);running=true;updateHUD()};
updateHUD();
</script>
</body>
</html>
