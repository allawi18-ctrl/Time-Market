name: Visual QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qa/**'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Cache high-detail Sponza architecture
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/KhronosGroup/glTF-Sample-Assets.git /tmp/gltf-assets
          cd /tmp/gltf-assets
          git sparse-checkout set Models/Sponza/glTF
          mkdir -p "$GITHUB_WORKSPACE/qa-assets/sponza"
          cp -R Models/Sponza/glTF/. "$GITHUB_WORKSPACE/qa-assets/sponza/"
          du -sh "$GITHUB_WORKSPACE/qa-assets/sponza"
      - name: Download high-resolution Rocketbox humans
        run: |
          set -e
          base='https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults'
          mkdir -p qa-assets/rocket/player/{Export,Textures} qa-assets/rocket/merchant/{Export,Textures} qa-assets/rocket/female/{Export,Textures}
          curl -L --fail --retry 3 -o qa-assets/rocket/player/Export/Male_Adult_01.fbx "$base/Male_Adult_01/Export/Male_Adult_01.fbx"
          for f in m002_body_color.tga m002_body_normal.tga m002_head_color.tga m002_head_normal.tga m002_opacity_color.tga; do curl -L --fail --retry 3 -o "qa-assets/rocket/player/Textures/$f" "$base/Male_Adult_01/Textures/$f"; done
          curl -L --fail --retry 3 -o qa-assets/rocket/merchant/Export/Male_Adult_02.fbx "$base/Male_Adult_02/Export/Male_Adult_02.fbx"
          for f in m003_body_color.tga m003_body_normal.tga m003_head_color.tga m003_head_normal.tga m003_opacity_color.tga; do curl -L --fail --retry 3 -o "qa-assets/rocket/merchant/Textures/$f" "$base/Male_Adult_02/Textures/$f"; done
          curl -L --fail --retry 3 -o qa-assets/rocket/female/Export/Female_Adult_01.fbx "$base/Female_Adult_01/Export/Female_Adult_01.fbx"
          for f in f001_body_color.tga f001_body_normal.tga f001_head_color.tga f001_head_normal.tga f001_opacity_color.tga; do curl -L --fail --retry 3 -o "qa-assets/rocket/female/Textures/$f" "$base/Female_Adult_01/Textures/$f"; done
          du -sh qa-assets/rocket
      - name: Convert Rocketbox humans to GLB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender -b --python qa/convert_rocketbox.py -- qa-assets/rocket/player/Export/Male_Adult_01.fbx qa-assets/rocket/player.glb
          blender -b --python qa/convert_rocketbox.py -- qa-assets/rocket/merchant/Export/Male_Adult_02.fbx qa-assets/rocket/merchant.glb
          blender -b --python qa/convert_rocketbox.py -- qa-assets/rocket/female/Export/Female_Adult_01.fbx qa-assets/rocket/female.glb
          ls -lh qa-assets/rocket/*.glb
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/time-market-server.log 2>&1 &
          sleep 2
      - name: Capture real Build 08 gameplay QA
        run: node qa/visual-qa.mjs
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-market-build08-visual-qa
          path: qa-output/
          retention-days: 7
