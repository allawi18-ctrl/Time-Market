name: Visual QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'qa/**'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Cache full-body humans and motion locally
        run: |
          mkdir -p qa-assets
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/player.glb 'https://raw.githubusercontent.com/carlosfranzreb/ravas/main/rpm/public/avatar_2_m.glb'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/merchant.glb 'https://raw.githubusercontent.com/carlosfranzreb/ravas/main/rpm/public/avatar_4_m.glb'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/npc-f1.glb 'https://raw.githubusercontent.com/carlosfranzreb/ravas/main/rpm/public/avatar_1_f.glb'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/npc-f2.glb 'https://raw.githubusercontent.com/carlosfranzreb/ravas/main/rpm/public/avatar_3_f.glb'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/idle.glb 'https://raw.githubusercontent.com/readyplayerme/animation-library/master/masculine/glb/idle/M_Standing_Idle_001.glb'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/walk.glb 'https://raw.githubusercontent.com/readyplayerme/animation-library/master/masculine/glb/locomotion/M_Walk_001.glb'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/run.glb 'https://raw.githubusercontent.com/readyplayerme/animation-library/master/masculine/glb/locomotion/M_Run_001.glb'
      - name: Cache high-detail Sponza architecture
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/KhronosGroup/glTF-Sample-Assets.git /tmp/gltf-assets
          cd /tmp/gltf-assets
          git sparse-checkout set Models/Sponza/glTF
          mkdir -p "$GITHUB_WORKSPACE/qa-assets/sponza"
          cp -R Models/Sponza/glTF/. "$GITHUB_WORKSPACE/qa-assets/sponza/"
          du -sh "$GITHUB_WORKSPACE/qa-assets/sponza"
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/time-market-server.log 2>&1 &
          echo $! > /tmp/time-market-server.pid
          sleep 2
      - name: Capture real in-game screenshot and video
        run: node qa/visual-qa.mjs
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-market-visual-qa
          path: qa-output/
          retention-days: 7
