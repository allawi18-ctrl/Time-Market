name: Visual QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'qa/**'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prepare historic hidden-market environment
        run: |
          mkdir -p qa-assets/hdri
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/hdri/vignaioli_night_1k.hdr 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/braustuble_alley_4k.hdr'
          curl -L --fail --retry 3 --max-time 180 -o qa-assets/hdri/vignaioli_night.jpg 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/braustuble_alley.jpg'
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageEnhance, ImageChops
          p='qa-assets/hdri/vignaioli_night.jpg'
          im=Image.open(p).convert('RGB')
          im=ImageEnhance.Brightness(im).enhance(0.38)
          im=ImageEnhance.Contrast(im).enhance(1.22)
          im=ImageEnhance.Color(im).enhance(0.82)
          tint=Image.new('RGB',im.size,(206,220,246))
          im=ImageChops.multiply(im,tint)
          im.save(p,quality=94,optimize=True)
          PY
      - name: Download PBR market materials
        run: |
          set -e
          mkdir -p qa-assets/textures
          curl -L --fail --retry 3 -o qa-assets/textures/wood_diff.jpg 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/wood_table_worn/wood_table_worn_diff_1k.jpg'
          curl -L --fail --retry 3 -o qa-assets/textures/wood_nor.jpg 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/wood_table_worn/wood_table_worn_nor_gl_1k.jpg'
          curl -L --fail --retry 3 -o qa-assets/textures/wood_rough.jpg 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/wood_table_worn/wood_table_worn_rough_1k.jpg'
          curl -L --fail --retry 3 -o qa-assets/textures/cobble_diff.jpg 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/cobblestone_floor_07/cobblestone_floor_07_diff_1k.jpg'
          curl -L --fail --retry 3 -o qa-assets/textures/cobble_nor.jpg 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/cobblestone_floor_07/cobblestone_floor_07_nor_gl_1k.jpg'
          curl -L --fail --retry 3 -o qa-assets/textures/cobble_rough.jpg 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/cobblestone_floor_07/cobblestone_floor_07_rough_1k.jpg'
          ls -lh qa-assets/textures
      - name: Download better Rocketbox humans and motions
        run: |
          set -e
          base='https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults'
          anim='https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Animations/all_animations_max_motextr_xy'
          mkdir -p qa-assets/rocket/player/{Export,Textures} qa-assets/rocket/merchant/{Export,Textures} qa-assets/rocket/female/{Export,Textures} qa-assets/rocket/anims
          curl -L --fail --retry 3 -o qa-assets/rocket/player/Export/Male_Adult_03.fbx "$base/Male_Adult_03/Export/Male_Adult_03.fbx"
          for f in m004_body_color.tga m004_body_normal.tga m004_head_color.tga m004_head_normal.tga m004_opacity_color.tga; do curl -L --fail --retry 3 -o "qa-assets/rocket/player/Textures/$f" "$base/Male_Adult_03/Textures/$f"; done
          curl -L --fail --retry 3 -o qa-assets/rocket/merchant/Export/Male_Adult_19.fbx "$base/Male_Adult_19/Export/Male_Adult_19.fbx"
          for f in m250_body_color.tga m250_body_normal.tga m250_head_color.tga m250_head_normal.tga m250_keffiyeh_color.tga m250_keffiyeh_normal.tga; do curl -L --fail --retry 3 -o "qa-assets/rocket/merchant/Textures/$f" "$base/Male_Adult_19/Textures/$f"; done
          curl -L --fail --retry 3 -o qa-assets/rocket/female/Export/Female_Adult_01.fbx "$base/Female_Adult_01/Export/Female_Adult_01.fbx"
          for f in f001_body_color.tga f001_body_normal.tga f001_head_color.tga f001_head_normal.tga f001_opacity_color.tga; do curl -L --fail --retry 3 -o "qa-assets/rocket/female/Textures/$f" "$base/Female_Adult_01/Textures/$f"; done
          curl -L --fail --retry 3 -o qa-assets/rocket/anims/m_walk.fbx "$anim/m_walk_neutral.max.fbx"
          curl -L --fail --retry 3 -o qa-assets/rocket/anims/m_run.fbx "$anim/m_run_neutral.max.fbx"
          curl -L --fail --retry 3 -o qa-assets/rocket/anims/f_walk.fbx "$anim/f_walk_neutral.max.fbx"
          du -sh qa-assets/rocket
      - name: Run local server
        run: |
          python3 -m http.server 8000 > /tmp/time-market-server.log 2>&1 &
          sleep 2
      - name: Capture real Build 18 gameplay QA
        run: node qa/visual-qa.mjs
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-market-build18-visual-qa
          path: qa-output/
          retention-days: 7
