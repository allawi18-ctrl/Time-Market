<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070b;color:#eee7dc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}#app{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;z-index:4}.top{position:absolute;top:max(9px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;direction:rtl}.panel{background:linear-gradient(180deg,rgba(8,12,18,.78),rgba(5,8,12,.58));border:1px solid rgba(224,176,88,.34);box-shadow:0 8px 26px #0008,inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}.life,.mission{border-radius:13px;padding:7px 10px}.life{min-width:158px}.mission{flex:1;max-width:235px}.label{font-size:9px;color:#b7a78c}.value{font-weight:800;color:#e8c689;font-size:13px;margin-top:2px}.mission .value{color:#eee8df;font-size:11px}.lifeLine{height:3px;background:#2a3037;border-radius:99px;margin-top:5px;overflow:hidden}.lifeLine i{display:block;height:100%;width:82%;background:linear-gradient(90deg,#6f491e,#e8bc68)}#zone{position:absolute;top:72px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 10px;border-radius:999px;background:rgba(5,9,14,.67);border:1px solid rgba(141,155,169,.36);font-size:9px;font-weight:700}.controls{position:absolute;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));height:102px}.joy{position:absolute;left:0;bottom:0;width:94px;height:94px;border-radius:50%;background:radial-gradient(circle,rgba(56,49,37,.55),rgba(4,8,12,.56) 72%);border:1px solid rgba(220,171,86,.36);box-shadow:inset 0 0 24px #0009}.joy:after{content:"";position:absolute;left:31px;top:31px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d7b572,#6f5030 68%,#201b17);border:1px solid #d8bd89}.interact{position:absolute;right:0;bottom:7px;width:84px;height:54px <body>
<div id="app"></div><div class="vignette"></div>
<div class="hud"><div class="top"><div class="life panel"><div class="label">العمر المتبقي</div><div class="value">23 سنة و 4 أشهر</div><div class="lifeLine"><i></i></div></div><div class="mission panel"><div class="label">المهمة الحالية</div><div class="value">تحدث مع تاجر السنوات</div></div></div><div id="zone">سوق العمر — الرواق القديم</div><div class="caption">تاجر السنوات أمامك</div><div class="controls"><div class="joy"></div><div class="bag">⌛</div><div class="interact">تفاعل</div></div></div>
<div id="loading" class="loading"><div class="loadCard panel"><h1>سوق العمر</h1><p>تهيئة الرواق والبشر والإضاءة الليلية...</p><div class="bar"><i id="loadBar"></i></div><div id="status" class="status">تهيئة</div><div id="err" class="error"></div></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const $=s=>document.querySelector(s),app=$('#app'),bar=$('#loadBar'),status=$('#status'),err=$('#err');
const setLoad=(n,t)=>{bar.style.width=n+'%';status.textContent=t};
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.74;renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101a);scene.fog=new THREE.FogExp2(0x0a1118,.017);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,120);camera.position.set(0,2.45,8.2);

scene.add(new THREE.HemisphereLight(0x89a9c8,0x1c120c,.42));const moon=new THREE.DirectionalLight(0x92b3d5,.82);moon.position.set(-9,14,8);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.camera.left=-14;moon.shadow.camera.right=14;moon.shadow.camera.top=17;moon.shadow.camera.bottom=-9;scene.add(moon);const fill=new THREE.DirectionalLight(0x566c82,.26);fill.position.set(8,5,-8);scene.add(fill);
const loader=new GLTFLoader();const load=u=>new Promise((res,rej)=>loader.load(u,res,undefined,rej));
setLoad(12,'تحميل العمارة عالية التفاصيل…');
const envGltf=await load('/qa-assets/sponza/Sponza.gltf');const env=envGltf.scene;scene.add(env);
// Make the architectural asset read as a wet night market instead of a daylight benchmark.
env.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=true;if(o.material){o.material=o.material.clone();if(o.material.color)o.material.color.multiply(new THREE.Color(.58,.61,.66));o.material.roughness=Math.max(.38,Math.min(.9,o.material.roughness??.7));o.material.metalness=Math.min(.18,o.material.metalness??0)}}});
let eb=new THREE.Box3().setFromObject(env),es=new THREE.Vector3();eb.getSize(es);if(es.x>es.z)env.rotation.y=Math.PI/2;eb.setFromObject(env);eb.getSize(es);const sc=34/Math.max(es.z,es.x);env.scale.setScalar(sc);eb.setFromObject(env);const ec=new THREE.Vector3();eb.getCenter(ec);env.position.x-=ec.x;env.position.z-=ec.z;env.position.y-=eb.min.y;eb.setFromObject(env);eb.getSize(es);
setLoad(34,'إضافة السوق والمطر…');
const wood=new THREE.MeshStandardMaterial({color:0x3a2115,roughness:.66});const woodEdge=new THREE.MeshStandardMaterial({color:0x160e0a,roughness:.6});const brass=new THREE.MeshStandardMaterial({color:0x8b612f,roughness:.34,metalness:.62});const cloth=[0x35171a,0x162a35,0x3c301b].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.92,side:THREE.DoubleSide}));
function warmLight(x,y,z,intensity=3.2,dist=7){const l=new THREE.PointLight(0xffa94d,intensity,dist,1.8);l.position.set(x,y,z);scene.add(l);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.055,8,6),new THREE.MeshBasicMaterial({color:0xffc06c}));bulb.position.copy(l.position);scene.add(bulb);return l}
function roundedCounter(x,z,side=1){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.BoxGeometry(1.9,.88,.72),wood);base.position.y=.48;base.castShadow=true;g.add(base);const top=new THREE.Mesh(new THREE.CylinderGeometry(.49,.49,2.06,18,1,false,0,Math.PI),woodEdge);top.rotation.z=Math.PI/2;top.rotation.x=Math.PI/2;top.scale.z=.42;top.position.y=.96;g.add(top);for(let i=0;i<5;i++){const obj=new THREE.Mesh(i%2?new THREE.IcosahedronGeometry(.1+Math.random()*.05,1):new THREE.CylinderGeometry(.07,.1,.2,10),i%3===0?brass:new THREE.MeshStandardMaterial({color:[0x6b4025,0x6b5a32,0x27424b][i%3],roughness:.46,metalness:i%3===2?.2:.04}));obj.position.set((Math.random()-.5)*1.3,1.12,(Math.random()-.5)*.42);obj.castShadow=true;g.add(obj)}g.position.set(x,0,z);g.rotation.y=side>0?-.1:.1;scene.add(g);return g}
function canopy(x,z,side=1,color=0){const geo=new THREE.PlaneGeometry(2.5,1.65,10,6);const p=geo.attributes.position;for(let i=0;i<p.count;i++){const xx=p.getX(i),yy=p.getY(i);p.setZ(i,-.12*Math.cos(xx*2.4)-.08*Math.pow(Math.abs(yy)/.83,1.6))}geo.computeVertexNormals();const m=new THREE.Mesh(geo,cloth[color%cloth.length]);m.position.set(x,2.05,z);m.rotation.x=-1.03;m.rotation.z=side>0?-.14:.14;scene.add(m);return m}
function hangingSign(text,x,y,z,rot=0){const c=document.createElement('canvas');c.width=640;c.height=220;const g=c.getContext('2d');g.fillStyle='#0d0b09';g.fillRect(0,0,c.width,c.height);g.strokeStyle='#9b6933';g.lineWidth=9;g.strokeRect(10,10,c.width-20,c.height-20);g.direction='rtl';g.textAlign='center';g.textBaseline='middle';g.font='700 70px Tahoma,Arial';g.fillStyle='#d9ad61';g.shadowBlur=14;g.shadowColor='#8e5425';g.fillText(text,c.width/2,c.height/2+3);const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(2.65,.91),new THREE.MeshBasicMaterial({map:tex}));m.position.set(x,y,z);m.rotation.y=rot;scene.add(m)}
const stallZ=[5.0,.4,-5.2,-10.8,-16.5];stallZ.forEach((z,i)=>{roundedCounter(-3.55,z,-1);canopy(-3.75,z,-1,i);roundedCounter(3.55,z,1);canopy(3.75,z,1,i+1);warmLight(-3.1,2.65,z,2.4);warmLight(3.1,2.65,z,2.4)});hangingSign('تاجر السنوات',3.0,3.45,-5.0,-.22);hangingSign('سوق العمر',-3.0,3.7,-11.0,.22);
// Wet central lane, intentionally subtle so the real architecture remains visible.
const wet=new THREE.Mesh(new THREE.PlaneGeometry(7.0,32),new THREE.MeshPhysicalMaterial({color:0x0d141a,roughness:.18,metalness:.05,clearcoat:1,clearcoatRoughness:.12,transparent:true,opacity:.38}));wet.rotation.x=-Math.PI/2;wet.position.set(0,.018,-7);wet.receiveShadow=true;scene.add(wet);
for(let i=0;i<15;i++){const p=new THREE.Mesh(new THREE.CircleGeometry(.26+Math.random()*.65,20),new THREE.MeshPhysicalMaterial({color:0x0a1218,roughness:.06,clearcoat:1,transparent:true,opacity:.25}));p.rotation.x=-Math.PI/2;p.scale.y=.35+Math.random()*.45;p.position.set((Math.random()-.5)*5.6,.024,6-Math.random()*26);scene.add(p)}
// Bank/time landmark — actual layered geometry rather than a single box.
const bank=new THREE.Group();const stone=new THREE.MeshStandardMaterial({color:0x191612,roughness:.56,metalness:.08});const doorMat=new THREE.MeshStandardMaterial({color:0x160e09,roughness:.32,metalness:.25});for(const x of [-2.8,2.8]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.62,.76,5.8,18),stone);p.position.set(x,2.9,0);p.castShadow=true;bank.add(p);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.22,18),brass);cap.position.set(x,5.75,0);bank.add(cap)}const top=new THREE.Mesh(new THREE.BoxGeometry(7.2,1.05,.85),stone);top.position.y=5.7;bank.add(top);const door=new THREE.Mesh(new THREE.BoxGeometry(4.4,4.8,.34),doorMat);door.position.y=2.4;bank.add(door);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.05,.18,14,42,Math.PI),brass);ring.position.set(0,4.75,.23);bank.add(ring);bank.position.set(0,.03,-20.5);scene.add(bank);hangingSign('بنك العمر',0,6.45,-20.0,0);warmLight(-2.0,4.9,-19.8,4.0);warmLight(2.0,4.9,-19.8,4.0);

setLoad(55,'تحميل البشر…');
const [pg,mg,f1g,f2g,ig,wg,rg]=await Promise.all([load('/qa-assets/player.glb'),load('/qa-assets/merchant.glb'),load('/qa-assets/npc-f1.glb'),load('/qa-assets/npc-f2.glb'),load('/qa-assets/idle.glb'),load('/qa-assets/walk.glb'),load('/qa-assets/run.glb')]);const bases=[pg.scene,mg.scene,f1g.scene,f2g.scene],clips=[ig.animations[0],wg.animations[0],rg.animations[0]];
const outfitColors=[new THREE.Color(0x17202a),new THREE.Color(0x33221b),new THREE.Color(0x1f2c29),new THREE.Color(0x30261b),new THREE.Color(0x2a1c20)];
function human(base,x,z,scale=1,heading=0,mode='idle',tint=0){const root=new THREE.Group(),m=SkeletonUtils.clone(base);m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();const nm=(o.name+' '+(o.material.name||'')).toLowerCase();const clothes=/(outfit|top|bottom|footwear|shirt|pants|jacket|dress|hoodie)/.test(nm);const skin=/(head|skin|eye|teeth|hair|beard)/.test(nm);if(clothes&&!skin&&o.material.color){o.material.color.lerp(outfitColors[tint%outfitColors.length],.58);o.material.roughness=.72}if(o.material.emissive)o.material.emissiveIntensity=0}}});let b=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3();b.getSize(sz);const s=(1.78/Math.max(.1,sz.y))*scale;m.scale.setScalar(s);b.setFromObject(m);m.position.y-=b.min.y;root.add(m);root.position.set(x,.04,z);root.rotation.y=heading;scene.add(root);const mixer=new THREE.AnimationMixer(m),actions={idle:mixer.clipAction(clips[0]),walk:mixer.clipAction(clips[1]),run:mixer.clipAction(clips[2])};Object.values(actions).forEach(a=>a.enabled=true);actions[mode].play();return{root,mixer,actions,state:mode}}
function switchAnim(h,to){if(h.state===to)return;h.actions[h.state].fadeOut(.18);h.actions[to].reset().fadeIn(.18).play();h.state=to}
const player=human(bases[0],0,7.2,1,Math.PI,'idle',0);const merchant=human(bases[1],2.65,-4.6,.98,-2.55,'idle',1);
// Merchant apron and shoulder wrap keep him visually distinct without replacing the human body.
const apron=new THREE.Mesh(new THREE.PlaneGeometry(.78,1.0,4,5),new THREE.MeshStandardMaterial({color:0x20140f,roughness:.96,side:THREE.DoubleSide}));apron.position.set(0,1.02,.24);merchant.root.add(apron);const wrap=new THREE.Mesh(new THREE.CylinderGeometry(.34,.52,.55,16,1,true),new THREE.MeshStandardMaterial({color:0x2b1a12,roughness:.9,side:THREE.DoubleSide}));wrap.position.y=1.38;merchant.root.add(wrap);
const crowd=[];const slots=[[-1.55,1.6,0],[1.6,-.8,Math.PI],[-1.2,-7.5,0],[1.5,-10.5,Math.PI],[-1.9,-14.0,0],[1.1,-17.4,Math.PI]];slots.forEach((s,i)=>{const h=human(bases[2+i%2],s[0],s[1],.93+(i%2)*.03,s[2],'walk',2+i);h.speed=.42+(i%3)*.11;h.dir=i%2?1:-1;crowd.push(h)});for(let i=0;i<4;i++){const side=i%2?1:-1;const h=human(bases[(i+1)%4],side*3.0,-2.8-i*4.6,.91,side>0?-Math.PI/2:Math.PI/2,'idle',i+1);h.speed=0;crowd.push(h)}
// Rain and mist.
const rc=900,rp=new Float32Array(rc*3);for(let i=0;i<rc;i++){rp[i*3]=(Math.random()-.5)*15;rp[i*3+1]=Math.random()*11;rp[i*3+2]=9-Math.random()*38}const rgeo=new THREE.BufferGeometry();rgeo.setAttribute('position',new THREE.BufferAttribute(rp,3));const rain=new THREE.Points(rgeo,new THREE.PointsMaterial({color:0x91afc4,size:.022,transparent:true,opacity:.36,depthWrite:false}));scene.add(rain);const mist=[];for(let i=0;i<14;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.18+Math.random()*.2,7,5),new THREE.MeshBasicMaterial({color:0xa9b8bd,transparent:true,opacity:.035,depthWrite:false}));p.position.set((Math.random()>.5?1:-1)*(3.0+Math.random()*.4),.35+Math.random()*.9,4-Math.random()*24);p.userData.base=p.position.y;scene.add(p);mist.push(p)}
setLoad(91,'ضبط الكاميرا…');
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let last=performance.now(),yaw=0;
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last)/1000);last=t;const ix=(keys.has('d')?1:0)-(keys.has('a')?1:0),iz=(keys.has('s')?1:0)-(keys.has('w')?1:0);if(ix||iz){const run=keys.has('shift'),sp=run?3.7:2.25,ang=Math.atan2(ix,-iz);yaw=THREE.MathUtils.lerp(yaw,ang,.13);player.root.rotation.y=yaw+Math.PI;player.root.position.x=THREE.MathUtils.clamp(player.root.position.x+Math.sin(ang)*sp*dt,-2.75,2.75);player.root.position.z=THREE.MathUtils.clamp(player.root.position.z-Math.cos(ang)*sp*dt,-18.3,7.2);switchAnim(player,run?'run':'walk')}else switchAnim(player,'idle');player.mixer.update(dt);merchant.mixer.update(dt);crowd.forEach(h=>{h.mixer.update(dt);if(h.speed){h.root.position.z+=h.dir*h.speed*dt;if(h.root.position.z>6){h.root.position.z=-18;h.dir=1}if(h.root.position.z<-19){h.root.position.z=5;h.dir=-1}h.root.rotation.y=h.dir>0?0:Math.PI}});const a=rain.geometry.attributes.position.array;for(let i=0;i<rc;i++){a[i*3+1]-=dt*(8.5+(i%6)*.55);a[i*3]-=.18*dt;if(a[i*3+1]<0){a[i*3+1]=11;a[i*3]=(Math.random()-.5)*15}}rain.geometry.attributes.position.needsUpdate=true;mist.forEach((p,i)=>{p.position.y+=dt*(.11+(i%4)*.025);if(p.position.y>p.userData.base+1.7)p.position.y=p.userData.base});const desired=new THREE.Vector3(player.root.position.x*.15,2.42,player.root.position.z+5.0);camera.position.lerp(desired,1-Math.pow(.003,dt));camera.lookAt(player.root.position.x*.10,1.28,player.root.position.z-3.8);renderer.render(scene,camera)}
requestAnimationFrame(tick);setLoad(100,'جاهز');setTimeout(()=>$('#loading').style.display='none',330);window.__TM_READY__=true;
