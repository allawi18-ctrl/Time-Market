function canvasTex(type,size=768){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');if(type==='cobble'){g.fillStyle='#151a1f';g.fillRect(0,0,size,size);for(let y=-40;y<size+80;y+=70){for(let x=-60;x<size+100;x+=105){const xx=x+((Math.floor(y/70)%2)*48)+(Math.random()*15-7),yy=y+Math.random()*8,w=88+Math.random()*18,h=54+Math.random()*12;g.fillStyle=`rgb(${23+Math.random()*15|0},${27+Math.random()*15|0},${31+Math.random()*16|0})`;g.beginPath();g.roundRect(xx,yy,w,h,12);g.fill();g.strokeStyle='rgba(4,6,8,.95)';g.lineWidth=8;g.stroke();g.strokeStyle='rgba(112,129,142,.10)';g.lineWidth=2;g.stroke();}}for(let i=0;i<160;i++){g.fillStyle='rgba(190,210,220,.055)';g.fillRect(Math.random()*size,Math.random()*size,2+Math.random()*8,1)}}else if(type==='plaster'){g.fillStyle='#494039';g.fillRect(0,0,size,size);for(let i=0;i<4500;i++){const v=45+Math.random()*40;g.fillStyle=`rgba(${v},${v*.88|0},${v*.72|0},.08)`;g.fillRect(Math.random()*size,Math.random()*size,1+Math.random()*3,1+Math.random()*3)}}else if(type==='wood'){g.fillStyle='#24140d';g.fillRect(0,0,size,size);for(let y=0;y<size;y+=46){g.fillStyle=y%92===0?'#3b2013':'#2d180f';g.fillRect(0,y,size,43);g.strokeStyle='#120b07';g.lineWidth=3;g.strokeRect(0,y,size,43);for(let i=0;i<8;i++){g.strokeStyle='rgba(130,76,42,.13)';g.beginPath();g.moveTo(0,y+5+Math.random()*32);g.bezierCurveTo(size*.3,y+Math.random()*43,size*.6,y+Math.random()*43,size,y+Math.random()*43);g.stroke()}}}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t}
const cobble=canvasTex('cobble'),plaster=canvasTex('plaster'),wood=canvasTex('wood');cobble.repeat.set(2.2,14);plaster.repeat.set(2,2);wood.repeat.set(2,2);

function signTexture(text){const c=document.createElement('canvas');c.width=700;c.height=230;const g=c.getContext('2d');g.fillStyle='#0b0908';g.fillRect(0,0,c.width,c.height);g.strokeStyle='#ad7836';g.lineWidth=10;g.strokeRect(12,12,c.width-24,c.height-24);g.direction='rtl';g.textAlign='center';g.textBaseline='middle';g.font='700 78px Tahoma,Arial';g.fillStyle='#e8b95f';g.shadowColor='#b56c25';g.shadowBlur=20;g.fillText(text,c.width/2,c.height/2+4);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

function lantern(x,y,z,power=12){const group=new THREE.Group();const frame=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.48,8),new THREE.MeshStandardMaterial({color:0x4d321a,metalness:.75,roughness:.3}));const glow=new THREE.Mesh(new THREE.SphereGeometry(.085,10,8),new THREE.MeshBasicMaterial({color:0xffc265}));group.add(frame,glow);group.position.set(x,y,z);scene.add(group);const l=new THREE.PointLight(0xffa940,power,8,2);l.position.set(x,y,z);scene.add(l);return l}
function makeStall(side,z,i){const sx=side*5.15;box(2.5,1.1,1.25,darkWood,sx,.56,z);box(2.7,.16,1.55,woodMat,sx,1.65,z-.05);const aw=new THREE.Mesh(new THREE.PlaneGeometry(3.1,2.25),clothMats[i%clothMats.length]);aw.position.set(side*4.55,2.55,z);aw.rotation.set(-.58,0,side>0?-.18:.18);scene.add(aw);for(let k=0;k<5;k++){const obj=new THREE.Mesh(k%2?new THREE.SphereGeometry(.13+Math.random()*.08,10,8):new THREE.CylinderGeometry(.09,.12,.3,10),k%3===0?metal:new THREE.MeshStandardMaterial({color:[0x553020,0x886d42,0x39515a][k%3],roughness:.42,metalness:k%3===2?.35:.05}));obj.position.set(sx+(Math.random()-.5)*1.65,1.23,z+(Math.random()-.5)*.6);obj.castShadow=true;scene.add(obj)}if(i%2===0)lantern(side*4.35,3.15,z+.3,9)}

const gltf=new GLTFLoader();const load=url=>new Promise((res,rej)=>gltf.load(url,res,undefined,rej));
const AV=[
 'https://models.readyplayer.me/6185a4acfb622cf1cdc49348.glb?quality=high&textureSizeLimit=1024&textureAtlas=1024',
 'https://models.readyplayer.me/65a8dba831b23abb4f401bae.glb?quality=high&textureSizeLimit=1024&textureAtlas=1024',
 'https://models.readyplayer.me/6460d95f9ae10f45bffb2864.glb?quality=high&textureSizeLimit=1024&textureAtlas=1024',
 'https://models.readyplayer.me/67be034c9fab1c21c486eb14.glb?quality=high&textureSizeLimit=1024&textureAtlas=1024'
];
const AN={idle:'https://raw.githubusercontent.com/readyplayerme/animation-library/master/masculine/glb/idle/M_Standing_Idle_001.glb',walk:'https://raw.githubusercontent.com/readyplayerme/animation-library/master/masculine/glb/locomotion/M_Walk_001.glb',run:'https://raw.githubusercontent.com/readyplayerme/animation-library/master/masculine/glb/locomotion/M_Run_001.glb'};
setLoad(22,'تحميل الشخصيات البشرية…');
const avatarResults=await Promise.allSettled(AV.map(load));let bases=avatarResults.filter(x=>x.status==='fulfilled').map(x=>x.value.scene);if(!bases.length)throw new Error('تعذر تحميل النماذج البشرية');
setLoad(55,'تحميل حركات المشي والركض…');const animResults=await Promise.allSettled([load(AN.idle),load(AN.walk),load(AN.run)]);const clips=animResults.map(x=>x.status==='fulfilled'&&x.value.animations[0]?x.value.animations[0]:null);
function human(base,x,z,scale=1,heading=0,mode='idle'){const root=new THREE.Group();const m=SkeletonUtils.clone(base);m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();o.material.roughness=Math.min(.72,o.material.roughness??.6)}}});const b=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3();b.getSize(sz);const s=(1.78/Math.max(.1,sz.y))*scale;m.scale.setScalar(s);b.setFromObject(m);const minY=b.min.y;m.position.y-=minY;root.add(m);root.position.set(x,.03,z);root.rotation.y=heading;scene.add(root);const mixer=new THREE.AnimationMixer(m);const actions={};['idle','walk','run'].forEach((k,i)=>{if(clips[i]){actions[k]=mixer.clipAction(clips[i]);actions[k].setEffectiveWeight(1)}});if(actions[mode])actions[mode].play();return {root,m,mixer,actions,state:mode}}
function switchAnim(h,to){if(h.state===to||!h.actions[to])return;const old=h.actions[h.state];if(old)old.fadeOut(.22);h.actions[to].reset().fadeIn(.22).play();h.state=to}
setLoad(72,'تجهيز البطل والتاجر والسوق…');
const player=human(bases[0],0,6.0,1,Math.PI,'idle');const merchant=human(bases[Math.min(1,bases.length-1)],3.55,-4.1,.98,-Math.PI*.45,'idle');

const apron=new THREE.Mesh(new THREE.PlaneGeometry(.88,1.1,3,5),new THREE.MeshStandardMaterial({color:0x231713,roughness:.95,side:THREE.DoubleSide}));apron.position.set(0,1.05,.22);merchant.root.add(apron);
const crowd=[];const slots=[[-2.1,-2,0],[-1.0,-8,0],[2.0,-10,Math.PI],[-2.8,-15,0],[1.2,-18,Math.PI],[2.6,-23,Math.PI],[-1.7,-28,0],[.8,-33,Math.PI]];slots.forEach((s,i)=>{const h=human(bases[(i+2)%bases.length],s[0],s[1],.91+((i%3)*.035),s[2],'walk');h.speed=.5+(i%4)*.12;h.dir=i%2?1:-1;h.lane=s[0];crowd.push(h)});

const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let yaw=0;let last=performance.now();
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last)/1000);last=t;const time=t/1000;let ix=(keys.has('d')?1:0)-(keys.has('a')?1:0),iz=(keys.has('s')?1:0)-(keys.has('w')?1:0);const moving=ix||iz;if(moving){const run=keys.has('shift');const sp=run?4.2:2.5;const ang=Math.atan2(ix,-iz);yaw=THREE.MathUtils.lerp(yaw,ang,.12);player.root.rotation.y=yaw+Math.PI;player.root.position.x=THREE.MathUtils.clamp(player.root.position.x+Math.sin(ang)*sp*dt,-3.1,3.1);player.root.position.z=THREE.MathUtils.clamp(player.root.position.z-Math.cos(ang)*sp*dt,-35,6);switchAnim(player,run?'run':'walk')}else switchAnim(player,'idle');
 for(const h of crowd){h.mixer.update(dt);if(h.speed){h.root.position.z+=h.dir*h.speed*dt;if(h.root.position.z>5){h.root.position.z=-36;h.dir=1}if(h.root.position.z<-37){h.root.position.z=4;h.dir=-1}h.root.rotation.y=h.dir>0?0:Math.PI}}
 player.mixer.update(dt);merchant.mixer.update(dt);
 const rp=rain.geometry.attributes.position.array;for(let i=0;i<rc;i++){rp[i*3+1]-=dt*(10+(i%5)*.8);rp[i*3]-=.25*dt;if(rp[i*3+1]<0){rp[i*3+1]=12;rp[i*3]=(Math.random()-.5)*18}}rain.geometry.attributes.position.needsUpdate=true;
