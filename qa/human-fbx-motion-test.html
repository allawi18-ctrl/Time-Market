<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b11;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#tag{position:fixed;z-index:3;top:16px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:18px;background:#070b11d9;border:1px solid #896637;font-size:11px;white-space:nowrap}.load{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#070b11}.load div{padding:18px 22px;border-radius:15px;background:#0b1017;border:1px solid #896637;color:#d8b56e}</style></head><body><div id="app"></div><div id="tag">Rocketbox FBX + الحركة الأصلية مباشرة</div><div id="load" class="load"><div>تحميل البشر والحركات...</div></div><script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {TGALoader} from 'three/addons/loaders/TGALoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.86;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('app').appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x101923);scene.fog=new THREE.FogExp2(0x101923,.018);const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,1.8,7.4);const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.025).texture;scene.add(new THREE.HemisphereLight(0xa3b9cf,0x29180d,.78));const key=new THREE.DirectionalLight(0xffddb7,1.55);key.position.set(-4,7,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x7095c0,.75);rim.position.set(5,5,-3);scene.add(rim);for(const x of [-3.1,3.1]){const l=new THREE.PointLight(0xffa64c,2.3,7.5,2);l.position.set(x,2.55,.4);scene.add(l)}const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshPhysicalMaterial({color:0x131920,roughness:.27,clearcoat:.75,clearcoatRoughness:.22}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const fbx=new FBXLoader(),tga=new TGALoader();const fload=u=>new Promise((r,j)=>fbx.load(u,r,undefined,j));const tload=async(u,color=false)=>{const t=await tga.loadAsync(u);if(color)t.colorSpace=THREE.SRGBColorSpace;return t};
async function human(folder,file,prefix){const b=`/qa-assets/rocket/${folder}`;const [obj,bc,bn,hc,hn,op]=await Promise.all([fload(`${b}/Export/${file}`),tload(`${b}/Textures/${prefix}_body_color.tga`,true),tload(`${b}/Textures/${prefix}_body_normal.tga`),tload(`${b}/Textures/${prefix}_head_color.tga`,true),tload(`${b}/Textures/${prefix}_head_normal.tga`),tload(`${b}/Textures/${prefix}_opacity_color.tga`,true)]);obj.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;const mats=(Array.isArray(o.material)?o.material:[o.material]).map(mat=>{const n=(mat?.name||'').toLowerCase(),kind=n.includes('_head')?'head':(n.includes('_opacity')?'opacity':'body');const m=new THREE.MeshStandardMaterial({roughness:kind==='opacity'?.7:.54,metalness:0,side:kind==='opacity'?THREE.DoubleSide:THREE.FrontSide});if(kind==='head'){m.map=hc;m.normalMap=hn;m.normalScale.set(.4,.4)}else if(kind==='body'){m.map=bc;m.normalMap=bn;m.normalScale.set(.4,.4)}else{m.map=op;m.alphaMap=op;m.alphaTest=.22;m.side=THREE.DoubleSide}return m});o.material=Array.isArray(o.material)?mats:mats[0]});return obj}
function place(obj,x,z,heading=0){const root=new THREE.Group();root.add(obj);scene.add(root);let b=new THREE.Box3().setFromObject(obj),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);obj.scale.setScalar(1.78/s.y);obj.updateMatrixWorld(true);b.setFromObject(obj);b.getCenter(c);obj.position.x-=c.x;obj.position.z-=c.z;obj.position.y-=b.min.y;root.position.set(x,.02,z);root.rotation.y=heading;return root}
function cleanClip(src,name){const tracks=src.tracks.filter(t=>{const n=t.name.toLowerCase();const pos=n.endsWith('.position');return !(pos&&(n.includes('pelvis')||n.startsWith('bip01.')||n.includes('bip01.position')))}).map(t=>t.clone());console.log('CLIP',name,'raw',src.tracks.length,'clean',tracks.length,'sample',tracks.slice(0,8).map(t=>t.name));return new THREE.AnimationClip(name,src.duration,tracks)}
const [p,m,f,mWalk,mRun,fWalk]=await Promise.all([human('player','Male_Adult_01.fbx','m002'),human('merchant','Male_Adult_02.fbx','m003'),human('female','Female_Adult_01.fbx','f001'),fload('/qa-assets/rocket/anims/m_walk.fbx'),fload('/qa-assets/rocket/anims/m_run.fbx'),fload('/qa-assets/rocket/anims/f_walk.fbx')]);const pr=place(p,-1.45,0,.05),mr=place(m,1.45,0,-.05),fr=place(f,0,-2.15,Math.PI);const walk=cleanClip(mWalk.animations[0],'Walk'),run=cleanClip(mRun.animations[0],'Run'),fwalk=cleanClip(fWalk.animations[0],'Walk');const pmix=new THREE.AnimationMixer(p),pwalk=pmix.clipAction(walk);pwalk.play();const mmix=new THREE.AnimationMixer(m),mstand=mmix.clipAction(walk);mstand.play();mmix.update(.26);mstand.paused=true;const fmix=new THREE.AnimationMixer(f),fw=fmix.clipAction(fwalk);fw.play();document.getElementById('load').style.display='none';window.__TM_READY__=true;let last=performance.now(),a=0;function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last)/1000);last=t;a+=dt*.035;pmix.update(dt*.75);fmix.update(dt*.68);camera.position.x=Math.sin(a)*.7;camera.position.z=7.2+Math.cos(a)*.25;camera.lookAt(0,1.05,-.45);renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
