<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b11;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#tag{position:fixed;z-index:3;top:16px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:18px;background:#070b11d9;border:1px solid #896637;font-size:11px;white-space:nowrap}.load{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#070b11}.load div{padding:18px 22px;border-radius:15px;background:#0b1017;border:1px solid #896637;color:#d8b56e}</style></head><body><div id="app"></div><div id="tag">Rocketbox FBX الأصلي — بدون تحويل</div><div id="load" class="load"><div>تحميل FBX والخامات الأصلية...</div></div><script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {TGALoader} from 'three/addons/loaders/TGALoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101923);scene.fog=new THREE.FogExp2(0x101923,.018);const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,1.8,7.5);const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.025).texture;scene.add(new THREE.HemisphereLight(0xa3b9cf,0x29180d,.8));const key=new THREE.DirectionalLight(0xffddb7,1.65);key.position.set(-4,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.DirectionalLight(0x7095c0,.8);rim.position.set(5,5,-3);scene.add(rim);for(const x of [-3.1,3.1]){const l=new THREE.PointLight(0xffa64c,2.5,7.5,2);l.position.set(x,2.55,.4);scene.add(l)}const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshPhysicalMaterial({color:0x131920,roughness:.27,clearcoat:.75,clearcoatRoughness:.22}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const fbx=new FBXLoader(),tga=new TGALoader();
const fbxLoad=u=>new Promise((r,j)=>fbx.load(u,r,undefined,j));
const tgaLoad=async(u,color=false)=>{const t=await tga.loadAsync(u);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(color)t.colorSpace=THREE.SRGBColorSpace;return t};
async function loadHuman(folder,file,prefix){const base=`/qa-assets/rocket/${folder}`;const [obj,bodyC,bodyN,headC,headN,opacity]=await Promise.all([fbxLoad(`${base}/Export/${file}`),tgaLoad(`${base}/Textures/${prefix}_body_color.tga`,true),tgaLoad(`${base}/Textures/${prefix}_body_normal.tga`),tgaLoad(`${base}/Textures/${prefix}_head_color.tga`,true),tgaLoad(`${base}/Textures/${prefix}_head_normal.tga`),tgaLoad(`${base}/Textures/${prefix}_opacity_color.tga`,true)]);let meshCount=0;obj.traverse(o=>{if(!o.isMesh)return;meshCount++;o.castShadow=true;o.receiveShadow=true;const src=Array.isArray(o.material)?o.material:[o.material];o.material=src.map(mat=>{const n=(mat?.name||o.name||'').toLowerCase();const kind=n.includes('_head')?'head':(n.includes('_opacity')?'opacity':'body');const m=new THREE.MeshStandardMaterial({roughness:kind==='opacity'?.72:.55,metalness:0,side:kind==='opacity'?THREE.DoubleSide:THREE.FrontSide});if(kind==='head'){m.map=headC;m.normalMap=headN;m.normalScale.set(.42,.42)}else if(kind==='body'){m.map=bodyC;m.normalMap=bodyN;m.normalScale.set(.42,.42)}else{m.map=opacity;m.alphaMap=opacity;m.transparent=false;m.alphaTest=.22;m.side=THREE.DoubleSide}return m});if(!Array.isArray(o.material)&&o.material.length===1)o.material=o.material[0]});console.log('FBX_HUMAN',folder,'meshes',meshCount,'anims',obj.animations?.length||0);return obj}
function place(obj,x,z,heading=0){const root=new THREE.Group();root.add(obj);scene.add(root);obj.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(obj),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);console.log('RAW_BOUNDS',s.x,s.y,s.z);if(!(s.y>0&&s.y<100000))throw new Error('bad FBX bounds');const k=1.78/s.y;obj.scale.setScalar(k);obj.updateMatrixWorld(true);b.setFromObject(obj);b.getCenter(c);obj.position.x-=c.x;obj.position.z-=c.z;obj.position.y-=b.min.y;root.position.set(x,.02,z);root.rotation.y=heading;return root}
const [p,m,f]=await Promise.all([loadHuman('player','Male_Adult_01.fbx','m002'),loadHuman('merchant','Male_Adult_02.fbx','m003'),loadHuman('female','Female_Adult_01.fbx','f001')]);place(p,-1.45,0,.05);place(m,1.45,0,-.05);place(f,0,-2.15,Math.PI);document.getElementById('load').style.display='none';window.__TM_READY__=true;let last=performance.now(),a=0;function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last)/1000);last=t;a+=dt*.04;camera.position.x=Math.sin(a)*.7;camera.position.z=7.25+Math.cos(a)*.25;camera.lookAt(0,1.06,-.45);renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
