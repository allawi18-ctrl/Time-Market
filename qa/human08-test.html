veCamera(46,innerWidth/innerHeight,.1,80);camera.position.set(0,2.15,6.3);const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.03).texture;scene.add(new THREE.HemisphereLight(0xa9bdd1,0x25160d,.85));const key=new THREE.DirectionalLight(0xffe2bd,2.1);key.position.set(-4,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.DirectionalLight(0x6b96c8,1.1);rim.position.set(5,5,-3);scene.add(rim);const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshPhysicalMaterial({color:0x161a1f,roughness:.3,clearcoat:.8,clearcoatRoughness:.25}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);for(const x of [-3.2,3.2]){const l=new THREE.PointLight(0xffa64d,4.5,8,2);l.position.set(x,2.6,0);scene.add(l);const b=new THREE.Mesh(new THREE.SphereGeometry(.08,10,8),new THREE.MeshBasicMaterial({color:0xffc46d}));b.position.copy(l.position);scene.add(b)}const loader=new GLTFLoader(),load=u=>new Promise((r,j)=>loader.load(u,r,undefined,j));const [pg,mg,fg]=await Promise.all([load('/qa-assets/rocket/player.glb'),load('/qa-assets/rocket/merchant.glb'),load('/qa-assets/rocket/female.glb')]);function add(base,x,z,heading=0){const m=base.clone(true);m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();o.material.roughness=Math.max(.42,o.material.roughness??.5);o.material.metalness=0}}});let b=new THREE.Box3().setFromObject(m),s=new THREE.Vector3();b.getSize(s);const k=1.78/Math.max(.01,s.y);m.scale.setScalar(k);b.setFromObject(m);m.position.y-=b.min.y;m.position.x=x;m.position.z=z;m.rotation.y=heading;scene.add(m);return m}const player=add(pg.scene,-1.35,0,.15),merchant=add(mg.scene,1.35,0,-.15),female=add(fg.scene,0,-2.0,Math.PI);const apron=new THREE.Mesh(new THREE.PlaneGeometry(.72,.95),new THREE.MeshStandardMaterial({color:0x25150e,roughness:.95,side:THREE.DoubleSide}));apron.position.set(1.35,1.02,.24);apron.rotation.y=-.15;scene.add(apron);document.getElementById('load').style.display='none';window.__TM_READY__=true;let last=performance.now(),orbit=0;function tick(t){requestAnimationFrame(tick);const dt=Math.min(.04,(t-last)/1000);last=t;orbit+=dt*.09;camera.position.x=Math.sin(orbit)*1.15;camera.position.z=6.1+Math.cos(orbit)*.35;camera.lookAt(0,1.15,-.35);renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
